<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#020617" rx="12" />

  <!-- TEE Screen Header -->
  <rect x="0" y="0" width="800" height="42" fill="#0f172a" />
  <text x="20" y="27" fill="#38bdf8" font-family="monospace" font-weight="900" font-size="15">ECOCARDIOGRAFÍA TRANSESOFÁGICA (TEE) • PLANO MEDIOESOFÁGICO 4 CÁMARAS</text>
  <rect x="560" y="9" width="220" height="25" rx="6" fill="#dc2626" />
  <text x="670" y="26" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">⚠️ EMBOLIA GASEOSA VENOSA</text>

  <!-- Ultrasound Fan Arc -->
  <path d="M 400 65 L 120 460 A 380 380 0 0 0 680 460 Z" fill="#090d16" stroke="#334155" stroke-width="2" />

  <!-- Heart Chambers Anatomy -->
  <!-- Interatrial & Interventricular Septum (Bowed leftward due to high RV pressure) -->
  <path d="M 400 120 Q 450 250 460 410" stroke="#64748b" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M 330 240 Q 400 250 480 240" stroke="#64748b" stroke-width="7" fill="none" />

  <!-- Left Atrium (LA) & Left Ventricle (LV) - Clear / Free of air -->
  <text x="520" y="180" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="14">AI (Aurícula Izquierda)</text>
  <text x="540" y="340" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="14">VI (Ventrículo Izq)</text>
  <text x="510" y="365" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="11">Cavidades izquierdas libres</text>

  <!-- Right Atrium (RA) & Right Ventricle (RV) - Massively filled with hyperechoic microbubbles (Snowstorm) -->
  <ellipse cx="300" cy="180" rx="90" ry="70" fill="#1e1b4b" fill-opacity="0.5" />
  <ellipse cx="260" cy="340" rx="100" ry="80" fill="#1e1b4b" fill-opacity="0.5" />
  <text x="230" y="150" fill="#fca5a5" font-family="sans-serif" font-weight="900" font-size="15">AD (Aurícula Derecha)</text>
  <text x="210" y="310" fill="#fca5a5" font-family="sans-serif" font-weight="900" font-size="15">VD (Ventrículo Derecho)</text>

  <!-- Blizzard / Snowstorm of Microbubbles (Dense white-hot acoustic reflections) -->
  <!-- RV Bubbles -->
  <g fill="#ffffff" filter="drop-shadow(0 0 3px #38bdf8)">
    <circle cx="210" cy="330" r="6" /><circle cx="230" cy="350" r="4.5" /><circle cx="250" cy="320" r="7" /><circle cx="270" cy="345" r="5" /><circle cx="290" cy="330" r="6.5" />
    <circle cx="200" cy="360" r="5" /><circle cx="225" cy="375" r="4" /><circle cx="255" cy="365" r="7" /><circle cx="280" cy="380" r="5.5" /><circle cx="305" cy="355" r="4" />
    <circle cx="215" cy="305" r="5" /><circle cx="240" cy="290" r="6" /><circle cx="265" cy="305" r="4.5" /><circle cx="285" cy="295" r="5" /><circle cx="310" cy="315" r="6" />
    <!-- RA Bubbles -->
    <circle cx="260" cy="180" r="7" /><circle cx="280" cy="165" r="5.5" /><circle cx="300" cy="190" r="6" /><circle cx="320" cy="175" r="7.5" /><circle cx="340" cy="200" r="5" />
    <circle cx="250" cy="205" r="5" /><circle cx="275" cy="215" r="6.5" /><circle cx="295" cy="210" r="4" /><circle cx="315" cy="220" r="6" /><circle cx="335" cy="170" r="5.5" />
    <circle cx="270" cy="140" r="4.5" /><circle cx="290" cy="150" r="7" /><circle cx="310" cy="140" r="5" /><circle cx="330" cy="155" r="6" />
  </g>

  <!-- Acoustic Shadowing & Reverberation Artefacts behind bubbles -->
  <path d="M 180 380 L 160 450 L 330 450 L 310 380 Z" fill="#ffffff" fill-opacity="0.18" />

  <!-- Explanatory Annotations -->
  <rect x="30" y="70" width="220" height="95" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" />
  <text x="42" y="95" fill="#f87171" font-family="sans-serif" font-weight="900" font-size="13">SIGNO PATOGNOMÓNICO:</text>
  <text x="42" y="115" fill="#ffffff" font-family="sans-serif" font-weight="800" font-size="12">"Tormenta de Nieve"</text>
  <text x="42" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="11">Masiva entrada de aire por</text>
  <text x="42" y="148" fill="#cbd5e1" font-family="sans-serif" font-size="11">senos venosos durales abiertos.</text>
</svg>