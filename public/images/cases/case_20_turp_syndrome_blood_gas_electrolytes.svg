<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#040d1a" rx="12" />

  <!-- Analyzer Header -->
  <rect x="0" y="0" width="800" height="46" fill="#0b1e36" />
  <text x="24" y="30" fill="#38bdf8" font-family="monospace" font-weight="900" font-size="16">GASÓMETRO &amp; ANALIZADOR CRÍTICO POCT • GEM PREMIER 5000</text>
  <rect x="580" y="10" width="200" height="26" rx="6" fill="#b91c1c" />
  <text x="680" y="27" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">🚨 VALOR DE PÁNICO: Na+</text>

  <!-- Patient ID & Sample Banner -->
  <rect x="24" y="58" width="752" height="38" fill="#0f294a" rx="6" stroke="#1e3a8a" stroke-width="1" />
  <text x="40" y="82" fill="#93c5fd" font-family="sans-serif" font-weight="700" font-size="13">MUESTRA: SANGRE ARTERIAL INTRAOPERATORIA • SERVICIO: UROLOGÍA (RTU-P) • MINUTO 75</text>

  <!-- Main Highlight Box: HYPONATREMIA SEVERA -->
  <rect x="24" y="110" width="365" height="175" fill="#450a0a" rx="10" stroke="#ef4444" stroke-width="2.5" />
  <text x="44" y="140" fill="#fca5a5" font-family="sans-serif" font-weight="900" font-size="16">SODIO PLASMÁTICO (Na+)</text>
  <text x="44" y="215" fill="#ffffff" font-family="monospace" font-weight="900" font-size="72">108</text>
  <text x="200" y="195" fill="#fca5a5" font-family="sans-serif" font-weight="900" font-size="22">mEq/L</text>
  <text x="200" y="215" fill="#f87171" font-family="sans-serif" font-weight="800" font-size="13">↓↓ CRÍTICO</text>
  <text x="44" y="248" fill="#fecaca" font-family="sans-serif" font-weight="700" font-size="12">RANGO REF: 135 – 145 mEq/L</text>
  <text x="44" y="268" fill="#f87171" font-family="sans-serif" font-weight="900" font-size="13">⚠️ INTOXICACIÓN HÍDRICA AGUDA</text>

  <!-- Osmolality Highlight Box -->
  <rect x="410" y="110" width="366" height="175" fill="#1e1b4b" rx="10" stroke="#6366f1" stroke-width="2" />
  <text x="430" y="140" fill="#c7d2fe" font-family="sans-serif" font-weight="900" font-size="16">OSMOLALIDAD PLASMÁTICA CALC.</text>
  <text x="430" y="215" fill="#ffffff" font-family="monospace" font-weight="900" font-size="72">228</text>
  <text x="585" y="195" fill="#c7d2fe" font-family="sans-serif" font-weight="900" font-size="22">mOsm/kg</text>
  <text x="585" y="215" fill="#818cf8" font-family="sans-serif" font-weight="800" font-size="13">↓↓ HIPOOSMOLALIDAD</text>
  <text x="430" y="248" fill="#e0e7ff" font-family="sans-serif" font-weight="700" font-size="12">RANGO REF: 280 – 295 mOsm/kg</text>
  <text x="430" y="268" fill="#a5b4fc" font-family="sans-serif" font-weight="900" font-size="13">RIESGO: EDEMA CEREBRAL AGUDO Y CONVULSIÓN</text>

  <!-- Secondary Parameters Table -->
  <rect x="24" y="300" width="752" height="180" fill="#08182b" rx="10" stroke="#1e3a8a" stroke-width="1.5" />
  <text x="44" y="330" fill="#38bdf8" font-family="sans-serif" font-weight="900" font-size="14">GASOMETRÍA ARTERIAL &amp; METABOLITOS ASOCIADOS</text>

  <!-- Grid of values -->
  <text x="44" y="365" fill="#94a3b8" font-family="sans-serif" font-size="13">pH arterial:</text>
  <text x="145" y="365" fill="#ffffff" font-family="monospace" font-weight="900" font-size="15">7.28</text>
  <text x="210" y="365" fill="#f87171" font-family="sans-serif" font-size="11">(Acidosis leve)</text>

  <text x="44" y="398" fill="#94a3b8" font-family="sans-serif" font-size="13">pCO2:</text>
  <text x="145" y="398" fill="#ffffff" font-family="monospace" font-weight="900" font-size="15">38.0 mmHg</text>
  <text x="250" y="398" fill="#22c55e" font-family="sans-serif" font-size="11">(35 - 45)</text>

  <text x="44" y="431" fill="#94a3b8" font-family="sans-serif" font-size="13">pO2:</text>
  <text x="145" y="431" fill="#ffffff" font-family="monospace" font-weight="900" font-size="15">74.0 mmHg</text>
  <text x="250" y="431" fill="#f59e0b" font-family="sans-serif" font-size="11">(Edema pulmonar incipiente)</text>

  <text x="44" y="462" fill="#94a3b8" font-family="sans-serif" font-size="13">Potasio (K+):</text>
  <text x="145" y="462" fill="#ffffff" font-family="monospace" font-weight="900" font-size="15">3.1 mEq/L</text>
  <text x="250" y="462" fill="#f59e0b" font-family="sans-serif" font-size="11">(Hipokalemia por dilución)</text>

  <!-- Right Column of values -->
  <text x="430" y="365" fill="#94a3b8" font-family="sans-serif" font-size="13">Cloro (Cl-):</text>
  <text x="560" y="365" fill="#ffffff" font-family="monospace" font-weight="900" font-size="15">76 mEq/L</text>
  <text x="660" y="365" fill="#f87171" font-family="sans-serif" font-size="11">(Hipocloremia)</text>

  <text x="430" y="398" fill="#94a3b8" font-family="sans-serif" font-size="13">Hemoglobina (Hb):</text>
  <text x="560" y="398" fill="#ffffff" font-family="monospace" font-weight="900" font-size="15">8.9 g/dL</text>
  <text x="660" y="398" fill="#f59e0b" font-family="sans-serif" font-size="11">(Hemodilución aguda)</text>

  <text x="430" y="431" fill="#94a3b8" font-family="sans-serif" font-size="13">Lactato:</text>
  <text x="560" y="431" fill="#ffffff" font-family="monospace" font-weight="900" font-size="15">2.9 mmol/L</text>

  <text x="430" y="462" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="13">INDICACIÓN:</text>
  <text x="530" y="462" fill="#fbbf24" font-family="sans-serif" font-weight="900" font-size="13">SUSPENDER RTU + CLORURO DE SODIO AL 3%</text>
</svg>