<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="saGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.2" />
    </radialGradient>
    <filter id="usNoise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.3 0 0 0 0  0 0.3 0 0 0  0 0 0.35 0 0  0 0 0 0.15 0" />
      <feComposite in2="SourceGraphic" in="gl" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>
  </defs>

  <rect width="800" height="500" fill="#050814" rx="12" />

  <!-- US Screen Header -->
  <rect x="0" y="0" width="800" height="40" fill="#0a0f1d" />
  <text x="20" y="26" fill="#38bdf8" font-family="monospace" font-weight="900" font-size="14">ECOGRAFÍA QUIRÚRGICA HFL50x • SONOSITE EDGE II</text>
  <text x="560" y="26" fill="#94a3b8" font-family="monospace" font-size="12">FREQ: 13-6 MHz | MI: 0.8 | TIS: 0.4</text>

  <!-- Ultrasound Sector Background -->
  <path d="M 60 50 L 740 50 L 680 470 L 120 470 Z" fill="#0b1120" stroke="#1e293b" stroke-width="2" />

  <!-- First Rib / Costal Shadow -->
  <path d="M 120 430 Q 400 450 680 430 L 680 470 L 120 470 Z" fill="#020617" />
  <path d="M 260 410 Q 420 420 580 405" stroke="#f8fafc" stroke-width="6" fill="none" opacity="0.85" filter="drop-shadow(0 4px 8px #ffffff)" />
  <text x="420" y="445" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="13" text-anchor="middle">SOMBRA ACÚSTICA - 1ª COSTILLA</text>

  <!-- Pleural Line (Medial) -->
  <line x1="140" y1="360" x2="260" y2="390" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <text x="180" y="345" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="12">LÍNEA PLEURAL</text>

  <!-- Subclavian Artery (Anechoic pulsatile round structure) -->
  <circle cx="340" cy="310" r="58" fill="url(#saGlow)" stroke="#ef4444" stroke-width="2.5" />
  <text x="340" y="315" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="14" text-anchor="middle">ARTERIA</text>
  <text x="340" y="333" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="13" text-anchor="middle">SUBCLAVIA</text>
  <text x="340" y="240" fill="#ef4444" font-family="sans-serif" font-weight="800" font-size="11" text-anchor="middle">DOPPLER PULSADO (+)</text>

  <!-- Brachial Plexus Trunks ("Cluster of Grapes" lateral-superficial to artery) -->
  <ellipse cx="440" cy="270" r="22" rx="20" ry="18" fill="#020617" stroke="#fbbf24" stroke-width="2.5" />
  <ellipse cx="475" cy="295" r="20" rx="18" ry="17" fill="#020617" stroke="#fbbf24" stroke-width="2.5" />
  <ellipse cx="445" cy="325" r="22" rx="19" ry="19" fill="#020617" stroke="#fbbf24" stroke-width="2.5" />
  <ellipse cx="490" cy="340" r="18" rx="16" ry="16" fill="#020617" stroke="#fbbf24" stroke-width="2.5" />
  <ellipse cx="520" cy="310" r="18" rx="16" ry="15" fill="#020617" stroke="#fbbf24" stroke-width="2.5" />

  <!-- Corner Pocket Annotation -->
  <path d="M 398 325 Q 415 355 435 345" stroke="#f59e0b" stroke-width="3" fill="none" stroke-dasharray="3,3" />
  <text x="500" y="240" fill="#fbbf24" font-family="sans-serif" font-weight="900" font-size="13">TRONCOS PLEXO BRAQUIAL</text>
  <text x="500" y="256" fill="#fde68a" font-family="sans-serif" font-weight="700" font-size="11">("Racimo de Uvas" hipoecoico)</text>

  <!-- Echogenic Needle Entering In-Plane from Lateral to Medial -->
  <line x1="710" y1="180" x2="415" y2="330" stroke="#f8fafc" stroke-width="3.5" filter="drop-shadow(0 0 6px #ffffff)" />
  <circle cx="415" cy="330" r="5" fill="#ef4444" stroke="#ffffff" stroke-width="2" />
  <text x="690" y="165" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="end">AGUJA ECOGÉNICA EN PLANO ➔</text>
  <text x="350" y="380" fill="#f87171" font-family="sans-serif" font-weight="900" font-size="12">⚠️ PUNTA EN "CORNER POCKET"</text>

  <!-- Local Anesthetic Spread (Hypoechoic fluid surrounding plexus) -->
  <path d="M 405 260 C 440 230, 540 270, 535 365 C 470 380, 410 350, 405 260 Z" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="535" y="390" fill="#38bdf8" font-family="sans-serif" font-weight="800" font-size="11">EXPANSIÓN ANESTÉSICO LOCAL (20 mL)</text>

  <!-- Orientation Badges -->
  <rect x="70" y="60" width="70" height="26" rx="4" fill="#1e293b" />
  <text x="105" y="77" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">MEDIAL</text>
  <rect x="660" y="60" width="70" height="26" rx="4" fill="#1e293b" />
  <text x="695" y="77" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">LATERAL</text>
</svg>