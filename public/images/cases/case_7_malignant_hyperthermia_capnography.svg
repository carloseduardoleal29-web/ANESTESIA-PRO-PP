<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#030712" rx="12" />
  <!-- Monitor Frame & Header -->
  <rect x="0" y="0" width="800" height="42" fill="#0f172a" />
  <text x="20" y="27" fill="#38bdf8" font-family="monospace" font-weight="900" font-size="16">MONITOR ANESTESIA QUIRÓFANO 03 • MODO CIRUGÍA</text>
  <rect x="580" y="10" width="200" height="24" rx="6" fill="#ef4444" />
  <text x="680" y="26" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">🚨 ALARMA CRÍTICA HM</text>

  <!-- Left Side: Capnogram Waveform Display -->
  <rect x="20" y="55" width="510" height="250" fill="#020617" rx="8" stroke="#334155" stroke-width="1.5" />
  <!-- Grid lines -->
  <line x1="20" y1="105" x2="530" y2="105" stroke="#1e293b" stroke-dasharray="4,4" />
  <line x1="20" y1="155" x2="530" y2="155" stroke="#1e293b" stroke-dasharray="4,4" />
  <line x1="20" y1="205" x2="530" y2="205" stroke="#1e293b" stroke-dasharray="4,4" />
  <line x1="20" y1="255" x2="530" y2="255" stroke="#1e293b" stroke-dasharray="4,4" />
  
  <text x="32" y="80" fill="#eab308" font-family="monospace" font-weight="900" font-size="16">CO2 ESPIRADO (mmHg) — ESCALA AMPLIADA 0-100</text>
  <text x="32" y="109" fill="#94a3b8" font-family="monospace" font-size="11">80 -</text>
  <text x="32" y="159" fill="#94a3b8" font-family="monospace" font-size="11">60 -</text>
  <text x="32" y="209" fill="#94a3b8" font-family="monospace" font-size="11">40 - (Normal)</text>
  <text x="32" y="259" fill="#94a3b8" font-family="monospace" font-size="11">20 -</text>

  <!-- Towering Runaway Capnogram Waveform peaking at 88 mmHg with elevated baseline -->
  <path d="M 60 285 L 90 285 L 95 92 L 155 88 L 160 285 L 190 285 L 195 92 L 255 88 L 260 285 L 290 285 L 295 92 L 355 88 L 360 285 L 390 285 L 395 92 L 455 88 L 460 285 L 510 285" 
        fill="none" stroke="#eab308" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 60 285 L 90 285 L 95 92 L 155 88 L 160 285 L 190 285 L 195 92 L 255 88 L 260 285 L 290 285 L 295 92 L 355 88 L 360 285 L 390 285 L 395 92 L 455 88 L 460 285 L 510 285 Z" 
        fill="url(#capnoGrad)" opacity="0.15" />

  <defs>
    <linearGradient id="capnoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- ECG Strip below Capnogram -->
  <rect x="20" y="320" width="510" height="160" fill="#020617" rx="8" stroke="#334155" stroke-width="1.5" />
  <text x="32" y="344" fill="#22c55e" font-family="monospace" font-weight="900" font-size="15">ECG DII • TAQUICARDIA SINUSAL EXTREMA + EXTRASÍSTOLES</text>
  <path d="M 30 410 L 60 410 L 65 400 L 70 425 L 75 350 L 80 435 L 85 410 L 105 385 L 120 410 
           L 145 410 L 150 400 L 155 425 L 160 350 L 165 435 L 170 410 L 190 385 L 205 410
           L 225 410 L 230 400 L 235 425 L 240 350 L 245 435 L 250 410 L 270 385 L 285 410
           L 300 410 L 305 330 L 315 450 L 330 370 L 350 410
           L 370 410 L 375 400 L 380 425 L 385 350 L 390 435 L 395 410 L 415 385 L 430 410
           L 450 410 L 455 400 L 460 425 L 465 350 L 470 435 L 475 410 L 495 385 L 515 410" 
        fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />

  <!-- Right Side Numeric Panels -->
  <!-- ETCO2 Big Display -->
  <rect x="545" y="55" width="235" height="135" fill="#1e1b4b" rx="8" stroke="#eab308" stroke-width="2" />
  <text x="560" y="80" fill="#fef08a" font-family="sans-serif" font-weight="900" font-size="13">EtCO2 (mmHg)</text>
  <text x="660" y="145" fill="#eab308" font-family="monospace" font-weight="900" font-size="64" text-anchor="middle">88</text>
  <text x="660" y="175" fill="#f87171" font-family="sans-serif" font-weight="800" font-size="12" text-anchor="middle">▲ ▲ INCONTROLABLE (Norm: 35-45)</text>

  <!-- Heart Rate Panel -->
  <rect x="545" y="200" width="112" height="90" fill="#052e16" rx="8" stroke="#22c55e" stroke-width="1.5" />
  <text x="555" y="222" fill="#86efac" font-family="sans-serif" font-weight="800" font-size="11">FC (lpm)</text>
  <text x="601" y="268" fill="#22c55e" font-family="monospace" font-weight="900" font-size="38" text-anchor="middle">162</text>

  <!-- Temp Panel -->
  <rect x="668" y="200" width="112" height="90" fill="#450a0a" rx="8" stroke="#ef4444" stroke-width="2" />
  <text x="678" y="222" fill="#fca5a5" font-family="sans-serif" font-weight="800" font-size="11">TEMP (°C)</text>
  <text x="724" y="268" fill="#ef4444" font-family="monospace" font-weight="900" font-size="36" text-anchor="middle">39.4</text>
  <text x="724" y="285" fill="#f87171" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle">▲ EN ASCENSO</text>

  <!-- Blood Pressure & Sevoflurane Warning Box -->
  <rect x="545" y="300" width="235" height="85" fill="#1e293b" rx="8" stroke="#64748b" stroke-width="1" />
  <text x="560" y="322" fill="#94a3b8" font-family="sans-serif" font-weight="800" font-size="11">PRESIÓN ARTERIAL (mmHg)</text>
  <text x="660" y="358" fill="#ffffff" font-family="monospace" font-weight="900" font-size="28" text-anchor="middle">175 / 105</text>
  <text x="660" y="376" fill="#38bdf8" font-family="monospace" font-weight="700" font-size="11" text-anchor="middle">PAM: 128 mmHg</text>

  <!-- Diagnostic Action Alert Strip -->
  <rect x="545" y="395" width="235" height="85" fill="#7f1d1d" rx="8" stroke="#ef4444" stroke-width="2" />
  <text x="660" y="420" fill="#ffffff" font-family="sans-serif" font-weight="900" font-size="12" text-anchor="middle">ACCIONES INMEDIATAS:</text>
  <text x="660" y="440" fill="#fecaca" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">1. CERRAR SEVOFLURANO</text>
  <text x="660" y="458" fill="#fecaca" font-family="sans-serif" font-weight="700" font-size="11" text-anchor="middle">2. DANTROLENO 2.5 mg/kg EV</text>
  <text x="660" y="474" fill="#fecaca" font-family="sans-serif" font-weight="700" font-size="10" text-anchor="middle">3. HIPERVENTILAR O2 100% 15 L/min</text>
</svg>