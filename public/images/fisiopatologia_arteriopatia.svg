<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#0b0f19" rx="16"/>
  <text x="450" y="40" fill="#f59e0b" font-size="20" font-weight="900" text-anchor="middle" font-family="sans-serif">ARTERIOPATÍA ESPIRAL Y ATEROSIS AGUDA</text>
  <g transform="translate(50, 70)">
    <rect width="800" height="390" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="400" cy="180" r="130" fill="#450a0a" stroke="#ef4444" stroke-width="12"/>
    <circle cx="400" cy="180" r="80" fill="#7f1d1d" stroke="#f59e0b" stroke-width="6"/>
    <!-- Lumen with severe stenosis -->
    <circle cx="400" cy="180" r="28" fill="#ef4444"/>
    <text x="400" y="185" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">LUZ 20%</text>
    <!-- Labels -->
    <text x="180" y="90" fill="#fca5a5" font-size="13" font-weight="bold" font-family="sans-serif">Células espumosas cargadas de lípidos</text>
    <line x1="280" y1="95" x2="340" y2="130" stroke="#fca5a5" stroke-width="2"/>
    <text x="620" y="90" fill="#fde047" font-size="13" font-weight="bold" font-family="sans-serif">Necrosis fibrinoide de la íntima</text>
    <line x1="610" y1="95" x2="480" y2="140" stroke="#fde047" stroke-width="2"/>
    <text x="620" y="270" fill="#f87171" font-size="13" font-weight="bold" font-family="sans-serif">Trombosis intraluminal plaquetaria</text>
    <line x1="610" y1="265" x2="440" y2="200" stroke="#f87171" stroke-width="2"/>
    <text x="400" y="340" fill="#38bdf8" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">RESISTENCIA VASCULAR AUMENTADA (Ley de Poiseuille: R ∝ 1/r⁴)</text>
    <text x="400" y="365" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">Flujo turbulento jet de alta velocidad ➔ Daño mecánico de microvellosidades sincitiotrofoblásticas</text>
  </g>
</svg>