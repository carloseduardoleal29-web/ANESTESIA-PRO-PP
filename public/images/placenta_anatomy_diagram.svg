<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="maternalDecidua" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#1f0208"/>
    </linearGradient>

    <linearGradient id="intervillousSpace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#18040a"/>
      <stop offset="100%" stop-color="#2d050f"/>
    </linearGradient>

    <linearGradient id="villusGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <filter id="toxicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="650" fill="#090d16" rx="16"/>

  <!-- Header Banner -->
  <rect x="35" y="20" width="830" height="55" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(55, 38)">
    <text x="0" y="16" fill="#10b981" font-size="16" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1">ESQUEMA HISTOLÓGICO: UNIDAD MATERNO-FETAL Y FISIOPATOLOGÍA</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif">Corte Transversal • Espacio Intervelloso, Vellosidades Coriónicas y Falla de Invasión Trofoblástica</text>
  </g>
  <rect x="715" y="32" width="135" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="782" y="52" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">MICROCIRCUITO</text>

  <!-- Main Anatomical Section Container -->
  <g transform="translate(50, 95)">
    <!-- 1. Top Section: Chorionic Plate (Fetal Surface) -->
    <rect x="0" y="0" width="800" height="40" rx="8" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="25" fill="#bae6fd" font-size="12" font-weight="900" font-family="sans-serif">PLACA CORIÓNICA FETAL (AMNIOS + VASOS CORIÓNICOS)</text>
    <rect x="650" y="8" width="130" height="24" rx="4" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
    <text x="715" y="24" fill="#93c5fd" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">HACIA EL FETO</text>

    <!-- 2. Middle Section: Intervillous Space (Blood Lake) -->
    <rect x="0" y="40" width="800" height="280" fill="url(#intervillousSpace)" stroke="#334155" stroke-width="1"/>

    <!-- Maternal Blood Inflow Jets (Spurting from constricted spiral arteries) -->
    <path d="M 200 320 C 190 240 240 180 230 110" stroke="#f43f5e" stroke-width="5" fill="none" opacity="0.85" stroke-dasharray="8,4"/>
    <path d="M 520 320 C 530 250 490 190 510 120" stroke="#f43f5e" stroke-width="5" fill="none" opacity="0.85" stroke-dasharray="8,4"/>

    <!-- Chorionic Villi Tree (Branching into intervillous lake) -->
    <!-- Stem Villus 1 (Left) -->
    <g transform="translate(120, 40)">
      <!-- Main Stem Trunk -->
      <path d="M 80 0 L 80 80 Q 50 140 30 190 Q 20 220 15 240" stroke="#3b82f6" stroke-width="18" fill="none" stroke-linecap="round"/>
      <!-- Syncytiotrophoblast Coat -->
      <path d="M 80 0 L 80 80 Q 50 140 30 190 Q 20 220 15 240" stroke="#93c5fd" stroke-width="24" fill="none" opacity="0.4" stroke-linecap="round"/>
      
      <!-- Lateral Terminal Branches -->
      <path d="M 75 70 Q 120 90 140 130" stroke="#3b82f6" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 60 110 Q 10 130 0 170" stroke="#3b82f6" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M 40 160 Q 90 180 110 220" stroke="#3b82f6" stroke-width="8" fill="none" stroke-linecap="round"/>

      <!-- Internal Fetal Capillaries Loops -->
      <path d="M 82 5 Q 82 75 52 135 Q 32 185 18 235" stroke="#ef4444" stroke-width="3" fill="none"/>
      <path d="M 78 5 Q 78 75 48 135 Q 28 185 14 235" stroke="#6366f1" stroke-width="3" fill="none"/>

      <circle cx="80" cy="80" r="16" fill="#1e1b4b" stroke="#60a5fa" stroke-width="2"/>
      <text x="80" y="84" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">Vell. 1</text>
    </g>

    <!-- Stem Villus 2 (Right) -->
    <g transform="translate(420, 40)">
      <path d="M 80 0 L 80 70 Q 110 130 130 180 Q 140 220 150 240" stroke="#3b82f6" stroke-width="18" fill="none" stroke-linecap="round"/>
      <path d="M 80 0 L 80 70 Q 110 130 130 180 Q 140 220 150 240" stroke="#93c5fd" stroke-width="24" fill="none" opacity="0.4" stroke-linecap="round"/>
      
      <path d="M 85 65 Q 40 85 20 125" stroke="#3b82f6" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M 95 110 Q 150 130 160 170" stroke="#3b82f6" stroke-width="9" fill="none" stroke-linecap="round"/>

      <!-- Internal Capillary Loop -->
      <path d="M 82 5 Q 112 125 132 175 Q 142 215 152 235" stroke="#ef4444" stroke-width="3" fill="none"/>
      <path d="M 78 5 Q 108 125 128 175 Q 138 215 148 235" stroke="#6366f1" stroke-width="3" fill="none"/>

      <!-- Toxic Molecules Shedding (sFlt-1 & sEng Glowing Orbs) -->
      <circle cx="160" cy="110" r="8" fill="#facc15" filter="url(#toxicGlow)"/>
      <text x="175" y="114" fill="#fef08a" font-size="9.5" font-weight="900" font-family="monospace">sFlt-1</text>

      <circle cx="40" cy="150" r="8" fill="#f43f5e" filter="url(#toxicGlow)"/>
      <text x="55" y="154" fill="#fecdd3" font-size="9.5" font-weight="900" font-family="monospace">sEng</text>
    </g>

    <!-- 3. Bottom Section: Decidua Basalis & Myometrium (Maternal Wall) -->
    <rect x="0" y="320" width="800" height="120" rx="8" fill="url(#maternalDecidua)" stroke="#881337" stroke-width="2"/>
    <text x="25" y="345" fill="#fda4af" font-size="12" font-weight="900" font-family="sans-serif">DECIDUA BASAL &amp; MIOMETRIO MATERNO (PARED UTERINA)</text>

    <!-- Normal Remodeled Spiral Artery (Hypothetical contrast - wide funnel) -->
    <g transform="translate(80, 320)">
      <!-- Narrow, Spastic Preeclamptic Artery (Left) -->
      <path d="M 60 120 L 60 70 Q 60 40 70 0 L 85 0 Q 75 40 75 70 L 75 120 Z" fill="#e11d48" stroke="#f43f5e" stroke-width="1.5"/>
      <!-- Muscular tunica media intact (Thick Pink Ring) -->
      <rect x="45" y="45" width="45" height="35" rx="6" fill="#881337" stroke="#fb7185" stroke-width="2" opacity="0.85"/>
      <text x="67" y="66" fill="#ffffff" font-size="8.5" font-weight="bold" font-family="sans-serif" text-anchor="middle">MÚSCULO</text>
      <text x="67" y="105" fill="#fecdd3" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle">ESPÁSTICA</text>
      <text x="67" y="117" fill="#fda4af" font-size="8" font-family="monospace" text-anchor="middle">Lumen Estrecho</text>
    </g>

    <!-- Normal Remodeled Spiral Artery (Right - for comparison) -->
    <g transform="translate(600, 320)">
      <!-- Wide Low Resistance Funnel -->
      <path d="M 30 120 L 30 70 Q 20 30 0 0 L 100 0 Q 80 30 70 70 L 70 120 Z" fill="#059669" stroke="#10b981" stroke-width="2" opacity="0.75"/>
      <text x="50" y="65" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">REMODELADA</text>
      <text x="50" y="80" fill="#a7f3d0" font-size="8.5" font-family="sans-serif" text-anchor="middle">Vaso Dilatado</text>
      <text x="50" y="105" fill="#6ee7b7" font-size="8" font-family="monospace" text-anchor="middle">Embarazo Normal</text>
    </g>

    <!-- Legend Central Callout in Decidua -->
    <g transform="translate(250, 350)">
      <rect width="300" height="75" rx="8" fill="#111827" stroke="#475569" stroke-width="1.5"/>
      <text x="15" y="22" fill="#ef4444" font-size="11" font-weight="900" font-family="sans-serif">FALLA DE INVASIÓN TROFOBLÁSTICA:</text>
      <text x="15" y="40" fill="#cbd5e1" font-size="10" font-family="sans-serif">El trofoblasto extravellositario no sustituye</text>
      <text x="15" y="55" fill="#cbd5e1" font-size="10" font-family="sans-serif">la capa media muscular. Vaso hiperreactivo</text>
      <text x="15" y="70" fill="#facc15" font-size="9.5" font-weight="bold" font-family="monospace">RVS placentaria elevada + Isquemia vellositaria</text>
    </g>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(35, 555)">
    <rect width="830" height="75" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(20, 18)">
      <text x="0" y="14" fill="#10b981" font-size="12" font-weight="900" font-family="sans-serif">MECANISMO DE LA ENFERMEDAD MATERNA:</text>
      <text x="0" y="34" fill="#e2e8f0" font-size="11" font-family="sans-serif">• La isquemia vellositaria gatilla la secreción masiva de sFlt-1 (antagonista de VEGF) y sEng (antagonista de TGF-β) al torrente materno.</text>
      <text x="0" y="52" fill="#facc15" font-size="11" font-weight="bold" font-family="sans-serif">• Destrucción del glicocálix endotelial en riñón (endoteliosis y proteinuria), cerebro (edema vasogénico PRES) e hígado (HELLP).</text>
    </g>
  </g>
</svg>
