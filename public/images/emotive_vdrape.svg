<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="drapeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#075985" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="bloodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="#0b1120" rx="16"/>

  <!-- Header -->
  <rect x="40" y="25" width="720" height="50" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="56" fill="#38bdf8" font-size="16" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1.5">PAQUETE E-MOTIVE: BOLSA COLECTORA V-DRAPE CALIBRADA</text>
  <rect x="620" y="37" width="120" height="26" rx="13" fill="#991b1b" stroke="#f87171" stroke-width="1"/>
  <text x="680" y="54" fill="#fee2e2" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">CUANTIFICACIÓN</text>

  <!-- V-Drape Funnel Bag -->
  <g transform="translate(180, 95)">
    <!-- Surgical Sheet Outline -->
    <path d="M 0 40 L 440 40 L 380 120 L 60 120 Z" fill="#0284c7" opacity="0.3" stroke="#38bdf8" stroke-width="2"/>
    <text x="220" y="75" fill="#bae6fd" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">SÁBANA QUIRÚRGICA OBSTÉTRICA IMPERMEABLE</text>

    <!-- Calibrated Funnel Pouch (V-Shape) -->
    <path d="M 60 120 L 380 120 L 270 420 L 170 420 Z" fill="url(#drapeGrad)" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Collected Blood Layer (750 mL - Severe HPP) -->
    <path d="M 125 280 L 315 280 L 270 420 L 170 420 Z" fill="url(#bloodGrad)" stroke="#ef4444" stroke-width="2"/>

    <!-- Meniscus Line at 750 mL -->
    <line x1="120" y1="280" x2="320" y2="280" stroke="#fca5a5" stroke-width="3" stroke-dasharray="6,3"/>
    <rect x="330" y="265" width="100" height="28" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="1.5"/>
    <text x="380" y="284" fill="#ffffff" font-size="12" font-weight="900" font-family="monospace" text-anchor="middle">750 mL</text>

    <!-- Calibration Markings and Lines -->
    <!-- 1000 mL -->
    <line x1="100" y1="230" x2="340" y2="230" stroke="#ef4444" stroke-width="2"/>
    <text x="350" y="235" fill="#ef4444" font-size="12" font-weight="900" font-family="monospace">1000 mL (CRÍTICO - CÓDIGO ROJO)</text>

    <!-- 500 mL Threshold (E-MOTIVE Trigger) -->
    <line x1="140" y1="330" x2="300" y2="330" stroke="#eab308" stroke-width="2.5"/>
    <text x="310" y="335" fill="#facc15" font-size="11" font-weight="900" font-family="monospace">500 mL (DISPARADOR E-MOTIVE)</text>

    <!-- 300 mL -->
    <line x1="155" y1="375" x2="285" y2="375" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="295" y="380" fill="#94a3b8" font-size="10" font-family="monospace">300 mL</text>

    <!-- Drain Port Filter -->
    <rect x="195" y="420" width="50" height="25" rx="4" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <text x="220" y="437" fill="#cbd5e1" font-size="9" font-family="sans-serif" text-anchor="middle">Válvula</text>
  </g>

  <!-- Side Legend Cards -->
  <g transform="translate(40, 480)">
    <rect width="720" height="90" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" fill="#38bdf8" font-size="13" font-weight="900" font-family="sans-serif">BENEFICIO CLÍNICO BASADO EN EVIDENCIA (ENSAYO E-MOTIVE, NEJM 2023):</text>
    <text x="20" y="52" fill="#e2e8f0" font-size="12" font-family="sans-serif">• La estimación visual subestima el sangrado posparto en un 30% a 50%. La bolsa calibrada detecta precozmente la hemorragia.</text>
    <text x="20" y="74" fill="#facc15" font-size="12" font-weight="bold" font-family="sans-serif">• Reducción del 60% en la tasa de hemorragia grave (sangrado ≥ 1000 mL o muerte materna) al activar el paquete temprano.</text>
  </g>
</svg>
