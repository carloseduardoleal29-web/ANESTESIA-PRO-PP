<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="stageGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Cotyledon Flesh Grad -->
    <radialGradient id="cotyledonGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#be123c"/>
      <stop offset="60%" stop-color="#881337"/>
      <stop offset="90%" stop-color="#4c0519"/>
      <stop offset="100%" stop-color="#2d0612"/>
    </radialGradient>

    <!-- Retroplacental Hematoma Clot Grad -->
    <radialGradient id="clotGrad" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="70%" stop-color="#1c0505"/>
      <stop offset="100%" stop-color="#050101"/>
    </radialGradient>

    <!-- Infarct Fibrinoid Gradient -->
    <linearGradient id="infarctGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>

    <!-- Calcification Texture -->
    <pattern id="calcPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#f8fafc" opacity="0.6"/>
      <circle cx="12" cy="10" r="1.2" fill="#fef08a" opacity="0.7"/>
    </pattern>
  </defs>

  <rect width="900" height="650" fill="url(#stageGrad)" rx="16"/>

  <!-- Header Banner -->
  <rect x="35" y="20" width="830" height="55" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(55, 38)">
    <text x="0" y="16" fill="#f43f5e" font-size="16" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1">PLACENTA HUMANA: CARA MATERNA (DECIDUA BASAL)</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif">Espécimen Macroscópico • Cotiledones, Infartos Fibrinoides y Hematoma Retroplacentario</text>
  </g>
  <rect x="715" y="32" width="135" height="30" rx="15" fill="#4c0519" stroke="#e11d48" stroke-width="1.5"/>
  <text x="782" y="52" fill="#fecdd3" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">PATOLOGÍA DPPNI</text>

  <!-- Main Placental Disc Group -->
  <g transform="translate(180, 100)">
    <!-- Marginal Membranes Flap (Chorioamniotic Rim) -->
    <path d="M 40 180 C 10 90 90 20 220 15 C 360 10 490 60 520 160 C 540 260 480 380 320 420 C 180 440 40 360 40 180 Z" fill="#9f1239" opacity="0.25" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6,4"/>

    <!-- Main Placental Disc Contour -->
    <path d="M 60 190 C 35 110 110 40 240 35 C 370 30 470 80 500 180 C 520 270 450 370 310 400 C 170 410 70 330 60 190 Z" fill="url(#cotyledonGrad)" stroke="#4c0519" stroke-width="6"/>

    <!-- Decidual Septa / Intercotyledon Sulci (Grooves) -->
    <!-- Grooves network dividing cotyledons -->
    <path d="M 120 110 Q 180 160 210 120 T 320 110 T 420 140" stroke="#2d0612" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 170 150 Q 230 220 200 300 T 270 380" stroke="#2d0612" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 230 220 Q 320 210 390 250 T 470 290" stroke="#2d0612" stroke-width="5.5" fill="none" stroke-linecap="round"/>
    <path d="M 320 110 Q 350 200 390 250" stroke="#2d0612" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 100 240 Q 160 250 200 300" stroke="#2d0612" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Individual Cotyledons (Lobules with volumetric 3D shading) -->
    <!-- Cotyledon 1 (Upper Left) -->
    <g transform="translate(100, 70)">
      <ellipse cx="45" cy="40" rx="35" ry="30" fill="#be123c" opacity="0.8"/>
      <circle cx="40" cy="35" r="25" fill="#e11d48" opacity="0.4"/>
      <text x="45" y="44" fill="#fecdd3" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">Cotiledón 1</text>
    </g>

    <!-- Cotyledon 2 (Upper Central) -->
    <g transform="translate(210, 50)">
      <ellipse cx="50" cy="45" rx="42" ry="35" fill="#be123c" opacity="0.85"/>
      <circle cx="45" cy="40" r="28" fill="#e11d48" opacity="0.45"/>
    </g>

    <!-- Cotyledon 3 (Upper Right) -->
    <g transform="translate(340, 75)">
      <ellipse cx="45" cy="40" rx="40" ry="32" fill="#be123c" opacity="0.8"/>
      <circle cx="40" cy="35" r="25" fill="#e11d48" opacity="0.4"/>
    </g>

    <!-- Cotyledon 4 (Mid Left - with Ischemic Infarct) -->
    <g transform="translate(75, 170)">
      <ellipse cx="45" cy="45" rx="40" ry="35" fill="#9f1239"/>
      <!-- Placental Infarction: White/Yellow necrotic plaque -->
      <path d="M 25 35 Q 45 20 65 35 Q 75 55 55 65 Q 30 65 25 35 Z" fill="url(#infarctGrad)" stroke="#fef08a" stroke-width="1.5"/>
      <text x="45" y="52" fill="#451a03" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle">INFARTO</text>
    </g>

    <!-- Cotyledon 5 (Center - Massive Adherent Retroplacental Hematoma) -->
    <g transform="translate(200, 150)">
      <!-- Deep Crater of Hematoma -->
      <ellipse cx="80" cy="75" rx="85" ry="65" fill="url(#clotGrad)" stroke="#e11d48" stroke-width="3.5"/>
      <!-- Fibrin Clot Texturing -->
      <path d="M 25 65 Q 75 40 135 60 Q 145 95 115 120 Q 55 125 25 65 Z" fill="#260408" stroke="#991b1b" stroke-width="2"/>
      <ellipse cx="80" cy="75" rx="45" ry="30" fill="#0d0204"/>
      <!-- Label directly on hematoma -->
      <text x="80" y="68" fill="#fca5a5" font-size="12" font-weight="900" font-family="sans-serif" text-anchor="middle">HEMATOMA RETROPLACENTARIO</text>
      <text x="80" y="85" fill="#fecdd3" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">Coágulo Oscuro Organizado (DPPNI)</text>
      <text x="80" y="100" fill="#fda4af" font-size="9" font-family="monospace" text-anchor="middle">Compresión de cotiledones subyacentes</text>
    </g>

    <!-- Cotyledon 6 (Mid Right) -->
    <g transform="translate(370, 170)">
      <ellipse cx="45" cy="40" rx="38" ry="34" fill="#be123c" opacity="0.8"/>
      <!-- Micro-calcifications pattern -->
      <circle cx="45" cy="40" r="30" fill="url(#calcPattern)"/>
    </g>

    <!-- Cotyledon 7 (Lower Left) -->
    <g transform="translate(110, 265)">
      <ellipse cx="40" cy="40" rx="36" ry="32" fill="#be123c" opacity="0.8"/>
    </g>

    <!-- Cotyledon 8 (Lower Center) -->
    <g transform="translate(200, 280)">
      <ellipse cx="50" cy="45" rx="45" ry="35" fill="#be123c" opacity="0.85"/>
      <circle cx="45" cy="40" r="28" fill="#e11d48" opacity="0.45"/>
    </g>

    <!-- Cotyledon 9 (Lower Right) -->
    <g transform="translate(320, 260)">
      <ellipse cx="45" cy="40" rx="40" ry="34" fill="#be123c" opacity="0.8"/>
      <!-- Second Infarct Area -->
      <ellipse cx="45" cy="40" rx="20" ry="15" fill="url(#infarctGrad)" stroke="#fef08a" stroke-width="1"/>
    </g>
  </g>

  <!-- Interactive Callout Badges with Pin Lines -->
  <!-- Callout 1: Cotiledones Deciduales -->
  <g transform="translate(45, 120)">
    <rect width="180" height="50" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="12" y="22" fill="#f43f5e" font-size="11" font-weight="900" font-family="sans-serif">COTILEDONES (15-20)</text>
    <text x="12" y="38" fill="#cbd5e1" font-size="9.5" font-family="sans-serif">Lóbulos de decidua basal esponjosa</text>
    <path d="M 180 25 L 240 25 L 270 90" stroke="#f43f5e" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="270" cy="90" r="4" fill="#f43f5e"/>
  </g>

  <!-- Callout 2: Infarto Fibrinoide Isquémico -->
  <g transform="translate(45, 270)">
    <rect width="195" height="60" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="12" y="22" fill="#facc15" font-size="11" font-weight="900" font-family="sans-serif">INFARTOS ISQUÉMICOS</text>
    <text x="12" y="38" fill="#fef08a" font-size="9.5" font-family="sans-serif">Necrosis vellositaria por trombosis</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="9" font-family="sans-serif">de arterias espirales ocluidas</text>
    <path d="M 195 30 L 225 30 L 235 220" stroke="#eab308" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="235" cy="220" r="4" fill="#eab308"/>
  </g>

  <!-- Callout 3: Hematoma Retroplacentario DPPNI -->
  <g transform="translate(640, 200)">
    <rect width="220" height="70" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="12" y="22" fill="#f87171" font-size="11" font-weight="900" font-family="sans-serif">HEMATOMA RETROPLACENTARIO</text>
    <text x="12" y="38" fill="#fca5a5" font-size="9.5" font-family="sans-serif">Coágulo firme adherido al lecho.</text>
    <text x="12" y="52" fill="#fca5a5" font-size="9.5" font-family="sans-serif">Signo patognomónico de DPPNI</text>
    <text x="12" y="65" fill="#cbd5e1" font-size="8.5" font-family="sans-serif">Secundario a crisis hipertensiva aguda</text>
    <path d="M 0 35 L -80 35 L -140 100" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="-140" cy="100" r="4" fill="#ef4444"/>
  </g>

  <!-- Callout 4: Calcificaciones Grannum III -->
  <g transform="translate(640, 360)">
    <rect width="210" height="55" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="22" fill="#38bdf8" font-size="11" font-weight="900" font-family="sans-serif">CALCIFICACIONES DISTRÓFICAS</text>
    <text x="12" y="38" fill="#bae6fd" font-size="9.5" font-family="sans-serif">Depósito de sales cálcicas basales</text>
    <text x="12" y="50" fill="#cbd5e1" font-size="9" font-family="sans-serif">Grannum Grado III (envejecimiento)</text>
    <path d="M 0 25 L -70 25 L -120 -50" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="-120" cy="-50" r="4" fill="#38bdf8"/>
  </g>

  <!-- Clinical Correlation Footer -->
  <g transform="translate(35, 550)">
    <rect width="830" height="75" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(20, 18)">
      <text x="0" y="14" fill="#f43f5e" font-size="12" font-weight="900" font-family="sans-serif">CORRELACIÓN ANATOMOCLÍNICA PARA EL ANESTESIÓLOGO:</text>
      <text x="0" y="34" fill="#e2e8f0" font-size="11" font-family="sans-serif">• El hematoma retroplacentario libera tromboplastina tisular masiva a la circulación materna, desencadenando Coagulación Intravascular Diseminada (CID).</text>
      <text x="0" y="52" fill="#facc15" font-size="11" font-weight="bold" font-family="sans-serif">• Conducta Quirúrgica: Si hay DPPNI &gt; 30-50% con hipertonía uterina, preparar Concentrado de Glóbulos Rojos, Crioprecipitados y Ácido Tranexámico.</text>
    </g>
  </g>
</svg>
