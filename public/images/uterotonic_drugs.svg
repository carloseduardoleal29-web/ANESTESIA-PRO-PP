<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#090d16" rx="16"/>

  <rect x="40" y="25" width="720" height="50" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="56" fill="#10b981" font-size="16" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1.5">UTEROTÓNICOS DE 1ª Y 2ª LÍNEA EN HEMORRAGIA POSPARTO</text>
  <rect x="620" y="37" width="120" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="680" y="54" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">FARMACOTERAPIA</text>

  <g transform="translate(40, 95)">
    <!-- Card 1: Oxitocina -->
    <g transform="translate(0, 0)">
      <rect width="345" height="180" rx="12" fill="#042f2e" stroke="#14b8a6" stroke-width="2"/>
      <rect width="345" height="35" rx="10" fill="#134e4a"/>
      <text x="15" y="23" fill="#5eead4" font-size="13" font-weight="900" font-family="sans-serif">OXITOCINA (1ª LÍNEA UNIVERSAL)</text>
      <text x="15" y="60" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace">Bolo: 3 a 5 UI IV lentas (en 1 min)</text>
      <text x="15" y="80" fill="#cbd5e1" font-size="12" font-family="monospace">Infusión: 20 a 40 UI en 500 mL SSN a 125 mL/h</text>
      <text x="15" y="110" fill="#99f6e4" font-size="11" font-family="sans-serif">Latencia: &lt; 1 min IV. Actúa sobre receptores OXTR.</text>
      <text x="15" y="130" fill="#facc15" font-size="10.5" font-weight="bold" font-family="sans-serif">⚠️ CUIDADO: Bolos rápidos causan hipotensión severa y colapso cardiovascular materno.</text>
      <rect x="15" y="145" width="80" height="22" rx="4" fill="#0f766e"/>
      <text x="55" y="160" fill="#ccfbf1" font-size="10" font-weight="bold" text-anchor="middle">Regla de 3</text>
    </g>

    <!-- Card 2: Metilergonovina / Ergometrina -->
    <g transform="translate(375, 0)">
      <rect width="345" height="180" rx="12" fill="#2e1065" stroke="#a855f7" stroke-width="2"/>
      <rect width="345" height="35" rx="10" fill="#3b0764"/>
      <text x="15" y="23" fill="#e9d5ff" font-size="13" font-weight="900" font-family="sans-serif">METILERGONOVINA (ALCALOIDE)</text>
      <text x="15" y="60" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace">Dosis: 0.2 mg IM (repetir c/2-4h)</text>
      <text x="15" y="80" fill="#cbd5e1" font-size="12" font-family="sans-serif">Contracción tetánica sostenida miometrial.</text>
      <text x="15" y="110" fill="#fca5a5" font-size="11" font-weight="900" font-family="sans-serif">🚫 CONTRAINDICACIÓN FORMAL ABSOLUTA:</text>
      <text x="15" y="130" fill="#fecdd3" font-size="11" font-weight="bold" font-family="sans-serif">¡NUNCA EN PREECLAMPSIA NI HIPERTENSIÓN!</text>
      <text x="15" y="150" fill="#f43f5e" font-size="10" font-family="sans-serif">Produce vasoespasmo severo, crisis hipertensiva y ACV.</text>
    </g>

    <!-- Card 3: Misoprostol -->
    <g transform="translate(0, 205)">
      <rect width="345" height="180" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="2"/>
      <rect width="345" height="35" rx="10" fill="#312e81"/>
      <text x="15" y="23" fill="#c7d2fe" font-size="13" font-weight="900" font-family="sans-serif">MISOPROSTOL (PROSTAGLANDINA E1)</text>
      <text x="15" y="60" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace">Dosis: 600 - 800 mcg Vía Sublingual o Rectal</text>
      <text x="15" y="80" fill="#cbd5e1" font-size="12" font-family="sans-serif">Análogo estable a temperatura ambiente.</text>
      <text x="15" y="110" fill="#a5b4fc" font-size="11" font-family="sans-serif">Inicio: 10-15 min sublingual. Pico rápido.</text>
      <text x="15" y="135" fill="#e0e7ff" font-size="10.5" font-family="sans-serif">Efectos secundarios: Escalofríos intensos e hipertermia transitoria (&gt; 38.5 °C).</text>
    </g>

    <!-- Card 4: Carbetocina -->
    <g transform="translate(375, 205)">
      <rect width="345" height="180" rx="12" fill="#31131d" stroke="#f43f5e" stroke-width="2"/>
      <rect width="345" height="35" rx="10" fill="#4c0519"/>
      <text x="15" y="23" fill="#fecdd3" font-size="13" font-weight="900" font-family="sans-serif">CARBETOCINA (ANÁLOGO SINTÉTICO)</text>
      <text x="15" y="60" fill="#ffffff" font-size="13" font-weight="bold" font-family="monospace">Dosis: 100 mcg IV bolo lento (en 1 min)</text>
      <text x="15" y="80" fill="#cbd5e1" font-size="12" font-family="sans-serif">Vida media 4 a 10 veces mayor que oxitocina.</text>
      <text x="15" y="110" fill="#fda4af" font-size="11" font-family="sans-serif">Mantiene contracción uterina sostenida por &gt; 4 horas.</text>
      <text x="15" y="135" fill="#fecdd3" font-size="10.5" font-family="sans-serif">Ideal para prevención en cesáreas con factores de alto riesgo de atonía uterina.</text>
    </g>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(40, 505)">
    <rect width="720" height="70" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="26" fill="#10b981" font-size="12" font-weight="900" font-family="sans-serif">REGLA MNEMOTÉCNICA ANESTESIAPRO:</text>
    <text x="20" y="48" fill="#e2e8f0" font-size="11.5" font-family="sans-serif">Oxitocina para TODOS los partos/cesáreas. En Preeclampsia: NUNCA Metilergonovina; usar Carbetocina o Misoprostol si hay atonía.</text>
  </g>
</svg>
