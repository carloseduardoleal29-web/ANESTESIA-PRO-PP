<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="pumpBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="ivFluid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Stage -->
  <rect width="800" height="600" fill="#090d16" rx="16"/>
  <circle cx="400" cy="300" r="380" fill="#0f172a" opacity="0.4"/>

  <!-- Top Banner Title -->
  <rect x="40" y="25" width="720" height="50" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="56" fill="#38bdf8" font-size="16" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1.5">ANESTESIAPRO • INFUSIÓN DE PRECISIÓN EN PREECLAMPSIA</text>
  <rect x="620" y="37" width="120" height="26" rx="13" fill="#065f46" stroke="#10b981" stroke-width="1"/>
  <text x="680" y="54" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">BOMBA ACTIVA</text>

  <!-- IV Pole / Stand -->
  <rect x="140" y="85" width="12" height="490" fill="#64748b" rx="4"/>
  <path d="M 120 110 L 146 85 L 172 110" stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Hanging IV Bags -->
  <!-- Bag 1: MgSO4 -->
  <g transform="translate(70, 115)">
    <path d="M 30 10 L 45 10 L 45 25 C 45 30 65 35 65 50 L 65 130 C 65 150 45 160 37 165 C 30 160 10 150 10 130 L 10 50 C 10 35 30 30 30 25 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 12 60 L 63 60 L 63 130 C 63 148 45 156 37 162 C 30 156 12 148 12 130 Z" fill="url(#ivFluid)"/>
    <text x="37" y="95" fill="#ffffff" font-size="10" font-weight="900" font-family="sans-serif" text-anchor="middle">MgSO₄ 50%</text>
    <text x="37" y="110" fill="#f0f9ff" font-size="8" font-family="monospace" text-anchor="middle">40g / 500 mL SSN</text>
    <path d="M 37 165 L 37 220" stroke="#bae6fd" stroke-width="3" fill="none"/>
    <!-- Drip Chamber -->
    <rect x="32" y="185" width="10" height="25" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  </g>

  <!-- Bag 2: Labetalol -->
  <g transform="translate(155, 120)">
    <path d="M 25 10 L 35 10 L 35 25 C 35 30 50 35 50 45 L 50 115 C 50 130 35 140 30 145 C 25 140 10 130 10 115 L 10 45 C 10 35 25 30 25 25 Z" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 12 55 L 48 55 L 48 115 C 48 128 35 136 30 142 C 25 136 12 128 12 115 Z" fill="#be123c" opacity="0.85"/>
    <text x="30" y="85" fill="#ffffff" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">LABETALOL</text>
    <text x="30" y="100" fill="#fecdd3" font-size="7.5" font-family="monospace" text-anchor="middle">200mg / 200mL</text>
    <path d="M 30 145 L 30 215" stroke="#fda4af" stroke-width="3" fill="none"/>
  </g>

  <!-- Smart Infusion Pump Console (Dual Channel) -->
  <g transform="translate(260, 100)">
    <!-- Main Chassis -->
    <rect x="0" y="0" width="480" height="440" rx="20" fill="url(#pumpBody)" stroke="#475569" stroke-width="3"/>
    
    <!-- Top Handle & Alarm Beacon -->
    <rect x="140" y="-22" width="200" height="22" rx="6" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <rect x="360" y="-12" width="50" height="12" rx="4" fill="#10b981" filter="url(#glow)"/>

    <!-- Dual LCD Touchscreen Display -->
    <rect x="25" y="30" width="430" height="230" rx="14" fill="#021a15" stroke="#059669" stroke-width="2.5"/>

    <!-- Screen Header -->
    <rect x="25" y="30" width="430" height="32" rx="12" fill="#042f2e"/>
    <text x="45" y="52" fill="#5eead4" font-size="12" font-weight="900" font-family="monospace">ANESTESIAPRO SMART-PUMP v4.2</text>
    <text x="375" y="52" fill="#10b981" font-size="11" font-weight="bold" font-family="monospace">RUNNING ●</text>

    <!-- Channel A (Left): Sulfato de Magnesio Zuspan -->
    <g transform="translate(40, 75)">
      <rect x="0" y="0" width="190" height="170" rx="10" fill="#042f2e" stroke="#0d9488" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="26" rx="8" fill="#134e4a"/>
      <text x="15" y="18" fill="#99f6e4" font-size="11" font-weight="900" font-family="sans-serif">CANAL A: MgSO₄ 50%</text>
      
      <text x="15" y="48" fill="#6ee7b7" font-size="9" font-family="sans-serif">VELOCIDAD PROGRAMADA</text>
      <text x="15" y="82" fill="#ffffff" font-size="32" font-weight="900" font-family="monospace">12.5</text>
      <text x="95" y="78" fill="#a7f3d0" font-size="13" font-weight="bold" font-family="monospace">mL/h</text>
      <text x="15" y="105" fill="#34d399" font-size="12" font-weight="bold" font-family="monospace">(= 1.0 g/hora)</text>

      <!-- Submetrics -->
      <line x1="15" y1="115" x2="175" y2="115" stroke="#115e59" stroke-width="1"/>
      <text x="15" y="132" fill="#cbd5e1" font-size="9" font-family="sans-serif">Vol. Infundido: <tspan fill="#f1f5f9" font-weight="bold">150 mL (12g)</tspan></text>
      <text x="15" y="150" fill="#cbd5e1" font-size="9" font-family="sans-serif">Límite VTBI: <tspan fill="#f1f5f9" font-weight="bold">500 mL (24h)</tspan></text>
      <circle cx="165" cy="50" r="7" fill="#10b981" filter="url(#glow)"/>
    </g>

    <!-- Channel B (Right): Antihipertensivo (Labetalol / Nicardipino) -->
    <g transform="translate(250, 75)">
      <rect x="0" y="0" width="190" height="170" rx="10" fill="#2a0815" stroke="#e11d48" stroke-width="1.5"/>
      <rect x="0" y="0" width="190" height="26" rx="8" fill="#4c0519"/>
      <text x="15" y="18" fill="#fecdd3" font-size="11" font-weight="900" font-family="sans-serif">CANAL B: LABETALOL</text>
      
      <text x="15" y="48" fill="#fda4af" font-size="9" font-family="sans-serif">TITULACIÓN CONTINUA</text>
      <text x="15" y="82" fill="#ffffff" font-size="32" font-weight="900" font-family="monospace">2.0</text>
      <text x="75" y="78" fill="#fecdd3" font-size="13" font-weight="bold" font-family="monospace">mg/min</text>
      <text x="15" y="105" fill="#fb7185" font-size="12" font-weight="bold" font-family="monospace">(= 24.0 mL/h)</text>

      <!-- Submetrics -->
      <line x1="15" y1="115" x2="175" y2="115" stroke="#881337" stroke-width="1"/>
      <text x="15" y="132" fill="#cbd5e1" font-size="9" font-family="sans-serif">PAS Meta: <tspan fill="#fecdd3" font-weight="bold">140 - 150 mmHg</tspan></text>
      <text x="15" y="150" fill="#cbd5e1" font-size="9" font-family="sans-serif">Presión Oclusión: <tspan fill="#34d399" font-weight="bold">OK (35 mmHg)</tspan></text>
      <circle cx="165" cy="50" r="7" fill="#10b981" filter="url(#glow)"/>
    </g>

    <!-- Physical Hardware Controls & Peristaltic Door Area -->
    <g transform="translate(25, 280)">
      <!-- Peristaltic Cassette Drive Channel 1 -->
      <rect x="0" y="0" width="200" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="15" y="15" width="170" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <path d="M 25 32 Q 100 20 175 32" stroke="#38bdf8" stroke-width="5" fill="none"/>
      <text x="100" y="72" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">CASSETTE VOLUMÉTRICO A</text>
      <!-- Buttons -->
      <circle cx="45" cy="105" r="16" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
      <polygon points="41,97 53,105 41,113" fill="#ffffff"/>
      <circle cx="95" cy="105" r="16" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
      <rect x="89" y="99" width="12" height="12" fill="#ffffff"/>
      <circle cx="145" cy="105" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <text x="145" y="109" fill="#e2e8f0" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">BOLO</text>
    </g>

    <g transform="translate(245, 280)">
      <!-- Peristaltic Cassette Drive Channel 2 -->
      <rect x="0" y="0" width="200" height="135" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
      <rect x="15" y="15" width="170" height="35" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
      <path d="M 25 32 Q 100 20 175 32" stroke="#f43f5e" stroke-width="5" fill="none"/>
      <text x="100" y="72" fill="#94a3b8" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">CASSETTE VOLUMÉTRICO B</text>
      <!-- Buttons -->
      <circle cx="45" cy="105" r="16" fill="#047857" stroke="#10b981" stroke-width="1.5"/>
      <polygon points="41,97 53,105 41,113" fill="#ffffff"/>
      <circle cx="95" cy="105" r="16" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
      <rect x="89" y="99" width="12" height="12" fill="#ffffff"/>
      <circle cx="145" cy="105" r="16" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
      <text x="145" y="109" fill="#e2e8f0" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">PURGA</text>
    </g>
  </g>

  <!-- Bottom Safety Guidelines Bar -->
  <g transform="translate(40, 545)">
    <rect width="720" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" fill="#facc15" font-size="12" font-weight="bold" font-family="sans-serif">ALERTA DE SEGURIDAD:</text>
    <text x="195" y="25" fill="#cbd5e1" font-size="11.5" font-family="sans-serif">Todo fármaco vasoactivo y MgSO₄ DEBE ser administrado exclusivamente por bomba de infusión continua con alarma de presión.</text>
  </g>
</svg>
