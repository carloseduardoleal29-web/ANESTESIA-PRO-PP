<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f2b4c" />
      <stop offset="45%" stop-color="#0a1d35" />
      <stop offset="100%" stop-color="#040b17" />
    </radialGradient>

    <!-- Metallic Chrome Cyan Gradients for CE Emblem -->
    <linearGradient id="chromeCyanLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="chromeBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="textStudioGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="emblemGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow Behind Emblem -->
  <ellipse cx="600" cy="190" rx="220" ry="110" fill="#0284c7" opacity="0.18" filter="blur(40px)" />

  <!-- ========================================== -->
  <!-- 3D METALLIC EMBLEM: CE + ASCENDING ARROW -->
  <!-- ========================================== -->
  <g transform="translate(600, 190)" filter="url(#dropShadow)" text-anchor="middle">
    <!-- Back Glow Contour -->
    <g opacity="0.4" filter="url(#emblemGlow)">
      <!-- Outer C -->
      <path d="M -20 -70 C -75 -70 -120 -25 -120 20 C -120 65 -75 110 -20 110 C 15 110 40 95 55 75 L 25 55 C 15 70 -3 82 -20 82 C -55 82 -88 52 -88 20 C -88 -12 -55 -42 -20 -42 C 0 -42 20 -30 32 -15 L 62 -35 C 40 -58 12 -70 -20 -70 Z" fill="#38bdf8" />
      <!-- E Structure -->
      <path d="M -5 -65 L 85 -65 L 85 -37 L 25 -37 L 25 -10 L 75 -10 L 75 18 L 25 18 L 25 78 L 90 78 L 90 106 L -5 106 Z" fill="#0284c7" />
    </g>

    <!-- Main Solid 3D Base: Letter E -->
    <path d="M 0 -62 L 95 -62 L 95 -34 L 32 -34 L 32 -6 L 82 -6 L 82 20 L 32 20 L 32 78 L 98 78 L 98 106 L 0 106 Z" 
          fill="url(#chromeCyanLight)" 
          stroke="#0369a1" 
          stroke-width="3"
          stroke-linejoin="round" />

    <!-- Top Highlight Line on E -->
    <path d="M 2 -60 L 93 -60 L 93 -36 L 34 -36 L 34 -4 L 80 -4 L 80 18 L 34 18 L 34 80 L 96 80 L 96 104 L 2 104 Z" 
          fill="none" 
          stroke="#e0f2fe" 
          stroke-width="1.5" 
          opacity="0.75" />

    <!-- Main Solid 3D Base: Letter C -->
    <path d="M -15 -68 C -70 -68 -118 -25 -118 20 C -118 65 -70 108 -15 108 C 22 108 55 88 68 62 L 40 44 C 28 62 8 78 -15 78 C -52 78 -86 48 -86 20 C -86 -8 -52 -38 -15 -38 C 5 -38 25 -25 38 -10 L 68 -28 C 50 -52 18 -68 -15 -68 Z" 
          fill="url(#chromeCyanLight)" 
          stroke="#bae6fd" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Inner Metallic Sheen Arc on C -->
    <path d="M -15 -62 C -65 -62 -110 -20 -110 20 C -110 60 -65 100 -15 100 C 18 100 48 82 60 58" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          opacity="0.85" />

    <!-- Dynamic Ascending Swoosh & Arrowhead (Medical Pulse & Innovation Theme) -->
    <!-- Curved Trail Swooping up from lower C -->
    <path d="M -45 52 C -20 62 10 50 35 15 C 55 -15 80 -45 110 -68" 
          fill="none" 
          stroke="url(#arrowGrad)" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- Inner Core Highlight for Arrow Swoop -->
    <path d="M -42 52 C -18 61 10 50 35 15 C 55 -15 80 -45 106 -66" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linecap="round" 
          opacity="0.95" />

    <!-- Arrowhead -->
    <polygon points="112,-88 126,-50 92,-64" 
             fill="url(#arrowGrad)" 
             stroke="#ffffff" 
             stroke-width="2.5" 
             stroke-linejoin="round" />
  </g>

  <!-- ========================================== -->
  <!-- TYPOGRAPHY: C.E. LEAL studio               -->
  <!-- ========================================== -->
  <g text-anchor="middle">
    <!-- C.E. LEAL -->
    <text x="600" y="380" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="64" 
          font-weight="900" 
          letter-spacing="5"
          filter="drop-shadow(0 4px 12px rgba(0,0,0,0.6))">
      C.E. LEAL
    </text>

    <!-- studio -->
    <text x="600" y="445" 
          fill="url(#textStudioGrad)" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="46" 
          font-weight="400" 
          letter-spacing="4"
          filter="drop-shadow(0 2px 8px rgba(0,0,0,0.5))">
      studio
    </text>

    <!-- Divider Accent Line -->
    <line x1="420" y1="482" x2="780" y2="482" stroke="#38bdf8" stroke-width="1.8" opacity="0.45" stroke-linecap="round" />
    <circle cx="600" cy="482" r="2.5" fill="#38bdf8" opacity="0.8" />

    <!-- SOFTWARE & MEDICAL APPS -->
    <text x="600" y="520" 
          fill="#94a3b8" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-size="19" 
          font-weight="700" 
          letter-spacing="9"
          filter="drop-shadow(0 1px 4px rgba(0,0,0,0.4))">
      SOFTWARE &amp; MEDICAL APPS
    </text>
  </g>
</svg>
