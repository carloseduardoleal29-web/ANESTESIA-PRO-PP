<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <rect width="800" height="500" fill="#030712" rx="14"/>
  <text x="400" y="35" fill="#38bdf8" font-size="18" font-weight="900" text-anchor="middle" font-family="sans-serif">UNIDAD NEUROVASCULAR: BARRERA HEMATOENCEFÁLICA (BHE)</text>
  <g transform="translate(40, 60)">
    <rect width="720" height="400" rx="10" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <!-- Capillary Vessel -->
    <rect x="50" y="140" width="620" height="120" rx="20" fill="#1e1b4b" stroke="#38bdf8" stroke-width="3"/>
    <!-- Endothelial cells & tight junctions -->
    <rect x="70" y="140" width="120" height="25" rx="6" fill="#0284c7"/>
    <rect x="210" y="140" width="140" height="25" rx="6" fill="#0284c7"/>
    <rect x="370" y="140" width="150" height="25" rx="6" fill="#0284c7"/>
    <rect x="540" y="140" width="110" height="25" rx="6" fill="#0284c7"/>
    <!-- Disrupted tight junctions -->
    <circle cx="200" cy="152" r="10" fill="#f43f5e"/>
    <text x="200" y="156" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">!</text>
    <circle cx="360" cy="152" r="10" fill="#f43f5e"/>
    <text x="360" y="156" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">!</text>
    <circle cx="530" cy="152" r="10" fill="#f43f5e"/>
    <text x="530" y="156" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">!</text>
    <!-- Astrocyte end feet -->
    <path d="M 120 70 Q 140 130 130 140 M 270 60 Q 280 120 290 140 M 450 65 Q 440 120 445 140 M 600 70 Q 590 125 595 140" stroke="#10b981" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="120" cy="65" r="22" fill="#059669"/>
    <text x="120" y="70" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Astro</text>
    <circle cx="270" cy="55" r="22" fill="#059669"/>
    <text x="270" y="60" fill="#fff" font-size="10" font-weight="bold" text-anchor="middle">Astro</text>
    <!-- Labels -->
    <text x="360" y="210" fill="#fca5a5" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">Pérdida de Autorregulación Miogénica + Hiperflujo</text>
    <text x="360" y="235" fill="#f43f5e" font-size="12" font-weight="bold" text-anchor="middle" font-family="sans-serif">Extravasación de líquido plasmático ➔ EDEMA VASOGÉNICO (PRES)</text>
    <text x="360" y="320" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Pies terminales astrocitarios (Aquaporina-4 AQP4)</text>
    <text x="360" y="345" fill="#94a3b8" font-size="11" text-anchor="middle" font-family="sans-serif">Clave terapéutica: Sulfato de Magnesio antagoniza NMDA y preserva integridad de BHE</text>
  </g>
</svg>