<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <rect width="600" height="450" fill="#2e1065" rx="12"/>
  <text x="300" y="28" fill="#f43f5e" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">FROTIS DE SANGRE PERIFÉRICA (TINCIÓN WRIGHT 100X)</text>
  <g transform="translate(50, 45)">
    <rect width="500" height="350" rx="10" fill="#4c1d95" stroke="#f43f5e" stroke-width="2"/>
    <!-- Normal RBCs -->
    <circle cx="120" cy="100" r="28" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <circle cx="120" cy="100" r="10" fill="#fca5a5"/>
    <circle cx="380" cy="120" r="28" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <circle cx="380" cy="120" r="10" fill="#fca5a5"/>
    <circle cx="220" cy="240" r="28" fill="#f87171" stroke="#dc2626" stroke-width="2"/>
    <!-- Schistocytes (Helmet, fragmented cells) -->
    <path d="M 230 100 Q 280 80 270 140 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <text x="255" y="70" fill="#fef08a" font-size="12" font-weight="bold" text-anchor="middle">Esquistocito</text>
    <line x1="255" y1="75" x2="255" y2="95" stroke="#fef08a" stroke-width="1.5"/>

    <path d="M 330 200 L 370 210 L 340 250 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="3"/>
    <text x="400" y="240" fill="#fef08a" font-size="12" font-weight="bold">Casco</text>

    <!-- Fibrin strands -->
    <line x1="180" y1="120" x2="330" y2="210" stroke="#fde047" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="170" y="160" fill="#fde047" font-size="11" font-weight="bold">Malla Fibrina</text>
    <text x="250" y="325" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">Hemólisis Microangiopática en Síndrome HELLP</text>
  </g>
</svg>