<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#38bdf8" font-size="20" font-weight="900" text-anchor="middle" font-family="sans-serif">COMPLICACIÓN HEPÁTICA EN HELLP: INFARTO &amp; HEMATOMA SUBCAPSULAR</text>
  <!-- Hepatic Anatomy & Hematoma -->
  <g transform="translate(30, 70)">
    <rect width="405" height="400" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect width="405" height="35" rx="12" fill="#78350f"/>
    <text x="202" y="24" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">ANATOMÍA DEL HEMATOMA SUBCAPSULAR</text>
    <text x="20" y="65" fill="#fde68a" font-size="12" font-family="sans-serif">Lóbulo hepático derecho: microtrombos periportales ➔ necrosis</text>
    <!-- Liver shape -->
    <path d="M 80 200 C 90 120 280 110 330 170 C 350 250 290 280 150 280 Z" fill="#881337" stroke="#be123c" stroke-width="3"/>
    <!-- Glisson capsule distension -->
    <path d="M 180 125 C 240 100 310 130 330 180 C 290 180 220 170 180 125 Z" fill="#dc2626" stroke="#fca5a5" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="260" y="150" fill="#ffffff" font-size="11" font-weight="bold">Hematoma a tensión</text>
    <text x="202" y="335" fill="#fbbf24" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Colección subcapsular de 1 a 3 Litros</text>
    <text x="202" y="360" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Dolor epigástrico en barra + Signo de Kehr (hombro derecho)</text>
    <text x="202" y="380" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">¡PROHIBIDA palpación abdominal vigorosa o Kristeller!</text>
  </g>
  <!-- Surgical Management -->
  <g transform="translate(465, 70)">
    <rect width="405" height="400" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="405" height="35" rx="12" fill="#991b1b"/>
    <text x="202" y="24" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">CONDUCTA PERIOPERATORIA &amp; QUIRÚRGICA</text>
    <text x="20" y="65" fill="#fca5a5" font-size="12" font-family="sans-serif">Rotura capsular ➔ Shock hipovolémico (Mortalidad > 50%)</text>
    <!-- Surgical packing icon representation -->
    <g transform="translate(100, 110)">
      <rect x="20" y="20" width="165" height="130" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
      <rect x="35" y="35" width="40" height="25" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <rect x="85" y="35" width="40" height="25" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <rect x="45" y="70" width="40" height="25" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <rect x="95" y="70" width="40" height="25" fill="#f1f5f9" stroke="#94a3b8" rx="3"/>
      <text x="102" y="125" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">Packing perihepático</text>
    </g>
    <text x="202" y="335" fill="#f87171" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Protocolo de Transfusión Masiva 1:1:1</text>
    <text x="202" y="360" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Estable: Manejo conservador en UCI con Angio-TC</text>
    <text x="202" y="380" fill="#38bdf8" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Rotura: Laparotomía urgente, packing &amp; embolización</text>
  </g>
</svg>
