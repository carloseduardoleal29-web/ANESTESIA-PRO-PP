<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#0f172a" rx="16"/>
  <text x="450" y="40" fill="#38bdf8" font-size="20" font-weight="900" text-anchor="middle" font-family="sans-serif">INVASIÓN TROFOBLÁSTICA: NORMAL VS DEFECTUOSA</text>
  <!-- Normal Panel -->
  <g transform="translate(30, 70)">
    <rect width="405" height="400" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="405" height="35" rx="12" fill="#065f46"/>
    <text x="202" y="24" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">EMBARAZO NORMAL (INVASIÓN COMPLETA)</text>
    <text x="20" y="65" fill="#a7f3d0" font-size="12" font-family="sans-serif">Citotrofoblasto extravellositario invade hasta tercio interno de miometrio</text>
    <!-- Normal vessel diagram -->
    <path d="M 50 120 C 120 120 120 280 200 280 C 280 280 280 120 350 120" fill="none" stroke="#ef4444" stroke-width="28" stroke-linecap="round"/>
    <path d="M 50 120 C 120 120 120 280 200 280 C 280 280 280 120 350 120" fill="none" stroke="#fca5a5" stroke-width="16" stroke-linecap="round"/>
    <circle cx="200" cy="280" r="45" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-dasharray="4 4"/>
    <text x="202" y="340" fill="#34d399" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Vaso dilatado de baja resistencia / alto flujo</text>
    <text x="202" y="365" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Pérdida de túnica elástica y muscular (Remodelación completa)</text>
    <text x="202" y="385" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Perfusion fetal óptima continua</text>
  </g>
  <!-- Preeclampsia Panel -->
  <g transform="translate(465, 70)">
    <rect width="405" height="400" rx="12" fill="#1e293b" stroke="#f43f5e" stroke-width="2"/>
    <rect width="405" height="35" rx="12" fill="#9f1239"/>
    <text x="202" y="24" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle" font-family="sans-serif">PREECLAMPSIA (INVASIÓN INCOMPLETA)</text>
    <text x="20" y="65" fill="#fecdd3" font-size="12" font-family="sans-serif">Invasión trofoblástica superficial limitada a la decidua basal</text>
    <!-- Constricted spiral vessel -->
    <path d="M 50 120 Q 90 190 120 140 T 180 220 T 250 160 T 350 200" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round"/>
    <circle cx="180" cy="220" r="25" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-dasharray="3 3"/>
    <text x="202" y="340" fill="#fb7185" font-size="13" font-weight="bold" text-anchor="middle" font-family="sans-serif">Vaso rígido, estenótico, alta resistencia</text>
    <text x="202" y="365" fill="#cbd5e1" font-size="11" text-anchor="middle" font-family="sans-serif">Persiste túnica media muscular (Reactividad adrenérgica)</text>
    <text x="202" y="385" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Isquemia placentaria ➔ Liberación masiva de sFlt-1 / sEng</text>
  </g>
</svg>