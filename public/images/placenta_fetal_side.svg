<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="fetalStageGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Fetal Plate Glossy Amnion Grad -->
    <radialGradient id="fetalPlateGrad" cx="45%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#1e3a8a"/>
      <stop offset="70%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Umbilical Cord 3D Twist -->
    <linearGradient id="cordGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Fetal Artery (Deoxygenated, darker violet/blue) -->
    <linearGradient id="fetalArtery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Fetal Vein (Oxygenated, bright crimson) -->
    <linearGradient id="fetalVein" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <filter id="fetalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="900" height="650" fill="url(#fetalStageGrad)" rx="16"/>

  <!-- Header Banner -->
  <rect x="35" y="20" width="830" height="55" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(55, 38)">
    <text x="0" y="16" fill="#38bdf8" font-size="16" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1">PLACENTA HUMANA: CARA FETAL (PLACA CORIÓNICA &amp; AMNIOS)</text>
    <text x="0" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif">Espécimen Macroscópico • Vasos Coriónicos Radiados, Gelatina de Wharton e Inserción de Cordón</text>
  </g>
  <rect x="715" y="32" width="135" height="30" rx="15" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
  <text x="782" y="52" fill="#bae6fd" font-size="11" font-weight="bold" text-anchor="middle" font-family="monospace">CIRCULACIÓN FETAL</text>

  <!-- Main Fetal Placenta Disc -->
  <g transform="translate(180, 100)">
    <!-- Peripheral Chorioamniotic Rim / Membranes Flap -->
    <path d="M 40 180 C 15 95 85 25 220 15 C 360 10 495 55 525 160 C 545 260 480 380 325 415 C 180 435 45 355 40 180 Z" fill="#0284c7" opacity="0.15" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4"/>

    <!-- Placental Disc Body (Smooth, glistening, bluish-translucent) -->
    <path d="M 60 190 C 35 110 110 40 240 35 C 370 30 470 80 500 180 C 520 270 450 370 310 400 C 170 410 70 330 60 190 Z" fill="url(#fetalPlateGrad)" stroke="#1e293b" stroke-width="5"/>

    <!-- Glossy Specular Light Reflection (Amnion wet sheen) -->
    <path d="M 120 100 Q 240 60 380 90 Q 420 140 350 160 Q 200 110 120 100 Z" fill="#ffffff" opacity="0.18"/>

    <!-- Chorionic Arborizing Blood Vessels (Radiating from Cord Insertion) -->
    <!-- Primary Arterial Branches (Deoxygenated blood from fetus) -->
    <g stroke="url(#fetalArtery)" fill="none" stroke-linecap="round">
      <!-- Upper Left Branch -->
      <path d="M 220 200 Q 180 140 130 110 Q 100 90 85 80" stroke-width="7"/>
      <path d="M 160 128 Q 130 150 110 170" stroke-width="4"/>
      <path d="M 130 110 Q 120 80 115 65" stroke-width="3.5"/>

      <!-- Upper Right Branch -->
      <path d="M 220 200 Q 280 140 350 100 Q 400 80 440 85" stroke-width="6.5"/>
      <path d="M 310 120 Q 340 70 365 60" stroke-width="4"/>
      <path d="M 370 95 Q 400 120 430 130" stroke-width="3.5"/>

      <!-- Lower Left Branch -->
      <path d="M 220 200 Q 180 250 130 300 Q 100 330 90 350" stroke-width="6.5"/>
      <path d="M 160 270 Q 135 260 115 255" stroke-width="3.5"/>
      <path d="M 140 290 Q 160 330 175 360" stroke-width="4"/>

      <!-- Lower Right Branch -->
      <path d="M 220 200 Q 280 260 340 320 Q 380 350 420 370" stroke-width="7"/>
      <path d="M 300 280 Q 360 270 410 280" stroke-width="4.5"/>
      <path d="M 360 335 Q 350 365 340 380" stroke-width="3.5"/>
    </g>

    <!-- Chorionic Venous Branches (Oxygenated blood to fetus - Red) -->
    <g stroke="url(#fetalVein)" fill="none" stroke-linecap="round">
      <path d="M 225 195 Q 260 130 300 90 Q 320 65 330 50" stroke-width="6"/>
      <path d="M 260 130 Q 230 100 205 85" stroke-width="3.5"/>

      <path d="M 225 195 Q 160 180 110 210 Q 80 230 70 250" stroke-width="6"/>
      <path d="M 135 195 Q 105 180 90 170" stroke-width="3.5"/>

      <path d="M 225 195 Q 230 270 240 340 Q 245 375 250 395" stroke-width="6.5"/>
      <path d="M 230 270 Q 275 295 305 310" stroke-width="4"/>

      <path d="M 225 195 Q 300 210 380 215 Q 430 220 460 230" stroke-width="6"/>
      <path d="M 340 210 Q 370 175 400 160" stroke-width="3.5"/>
    </g>

    <!-- Umbilical Cord Insertion (Paracentric / Eccentric Insertion) -->
    <g transform="translate(220, 195)">
      <!-- Cord Base Ring (Fetal Insertion Ring) -->
      <ellipse cx="0" cy="0" rx="36" ry="24" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
      
      <!-- 3D Umbilical Cord Body with Spiral Coiling -->
      <path d="M -25 -5 C -60 -70 -20 -140 10 -200 C 25 -230 10 -260 0 -280" stroke="url(#cordGrad)" stroke-width="38" fill="none" stroke-linecap="round"/>
      
      <!-- Spiral Twisting Stripes on Umbilical Cord -->
      <path d="M -25 -5 C -60 -70 -20 -140 10 -200 C 25 -230 10 -260 0 -280" stroke="#f43f5e" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="14,14"/>
      <path d="M -20 -2 C -55 -67 -15 -137 15 -197 C 30 -227 15 -257 5 -277" stroke="#6366f1" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="14,14" stroke-dashoffset="7"/>

      <!-- Cross Section at Top of Cord (Cut Surface) -->
      <g transform="translate(0, -280)">
        <ellipse cx="0" cy="0" rx="22" ry="14" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
        <!-- 1 Large Umbilical Vein (Oxygenated) -->
        <circle cx="0" cy="-3" r="5.5" fill="#e11d48" stroke="#991b1b" stroke-width="1.5"/>
        <!-- 2 Smaller Umbilical Arteries (Deoxygenated) -->
        <circle cx="-9" cy="4" r="3.5" fill="#4338ca" stroke="#312e81" stroke-width="1"/>
        <circle cx="9" cy="4" r="3.5" fill="#4338ca" stroke="#312e81" stroke-width="1"/>
        <text x="0" y="-18" fill="#ffffff" font-size="9" font-weight="900" font-family="sans-serif" text-anchor="middle">2 Arterias + 1 Vena</text>
      </g>
    </g>

    <!-- Subchorionic Fibrin Plaque (Preeclampsia Finding) -->
    <g transform="translate(320, 240)">
      <ellipse cx="20" cy="15" rx="25" ry="15" fill="#fef08a" opacity="0.75" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="20" y="19" fill="#713f12" font-size="8.5" font-weight="900" font-family="sans-serif" text-anchor="middle">Depósito Fibrina</text>
    </g>
  </g>

  <!-- Interactive Callouts with Pin Lines -->
  <!-- Callout 1: Cordón Umbilical y Gelatina de Wharton -->
  <g transform="translate(45, 110)">
    <rect width="210" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="22" fill="#38bdf8" font-size="11" font-weight="900" font-family="sans-serif">CORDÓN UMBILICAL ESPIRAL</text>
    <text x="12" y="38" fill="#bae6fd" font-size="9.5" font-family="sans-serif">Inserción paracentral excéntrica</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="9" font-family="sans-serif">Gelatina de Wharton y 3 vasos (2A+1V)</text>
    <path d="M 210 30 L 260 30 L 280 -60" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="280" cy="-60" r="4" fill="#38bdf8"/>
  </g>

  <!-- Callout 2: Red Vascular Coriónica Radiada -->
  <g transform="translate(45, 270)">
    <rect width="200" height="60" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="12" y="22" fill="#a5b4fc" font-size="11" font-weight="900" font-family="sans-serif">VASOS CORIÓNICOS</text>
    <text x="12" y="38" fill="#c7d2fe" font-size="9.5" font-family="sans-serif">Ramificación magistral radiada</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="9" font-family="sans-serif">Las arterias cruzan superficiales a venas</text>
    <path d="M 200 30 L 250 30 L 290 230" stroke="#6366f1" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="290" cy="230" r="4" fill="#6366f1"/>
  </g>

  <!-- Callout 3: Membrana Amniótica Brillante -->
  <g transform="translate(640, 180)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="12" y="22" fill="#38bdf8" font-size="11" font-weight="900" font-family="sans-serif">MEMBRANA AMNIÓTICA</text>
    <text x="12" y="38" fill="#bae6fd" font-size="9.5" font-family="sans-serif">Superficie fetal brillante y lisa</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="9" font-family="sans-serif">Amnios avascular adherido al corion</text>
    <path d="M 0 30 L -60 30 L -120 100" stroke="#38bdf8" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="-120" cy="100" r="4" fill="#38bdf8"/>
  </g>

  <!-- Callout 4: Depósito de Fibrina Subcoriónica -->
  <g transform="translate(640, 340)">
    <rect width="220" height="60" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="1.5"/>
    <text x="12" y="22" fill="#facc15" font-size="11" font-weight="900" font-family="sans-serif">FIBRINA SUBCORIÓNICA</text>
    <text x="12" y="38" fill="#fef08a" font-size="9.5" font-family="sans-serif">Placas blanquecinas subamnióticas</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="9" font-family="sans-serif">Hallazgo frecuente en hipoxia fetal crónica</text>
    <path d="M 0 30 L -60 30 L -100 0" stroke="#eab308" stroke-width="1.5" fill="none" stroke-dasharray="3,3"/>
    <circle cx="-100" cy="0" r="4" fill="#eab308"/>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(35, 550)">
    <rect width="830" height="75" rx="12" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <g transform="translate(20, 18)">
      <text x="0" y="14" fill="#38bdf8" font-size="12" font-weight="900" font-family="sans-serif">IMPLICACIÓN CLÍNICA PERIOPERATORIA:</text>
      <text x="0" y="34" fill="#e2e8f0" font-size="11" font-family="sans-serif">• En preeclampsia severa con RCIU, las arterias coriónicas muestran resistencia de flujo patológica (Doppler de arteria umbilical con flujo ausente o reverso).</text>
      <text x="0" y="52" fill="#facc15" font-size="11" font-weight="bold" font-family="sans-serif">• Gasometría de Cordón Umbilical Inmediata: Tomar muestra de la vena y arteria umbilical tras el alumbramiento para documentar pH y déficit de base.</text>
    </g>
  </g>
</svg>
