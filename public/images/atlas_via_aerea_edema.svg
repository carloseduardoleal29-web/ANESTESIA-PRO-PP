<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <radialGradient id="bgAero" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="panelGradNormal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="panelGradEdema" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <linearGradient id="cordGradNormal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="edemaMucosa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgAero)"/>

  <!-- Header -->
  <g transform="translate(50, 25)">
    <rect width="1100" height="55" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="550" y="25" fill="#38bdf8" font-size="12" font-weight="900" letter-spacing="2" text-anchor="middle" font-family="sans-serif">ATLAS ANATÓMICO ULTRA-HD • VÍA AÉREA OBSTÉTRICA CRÍTICA</text>
    <text x="550" y="45" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="sans-serif">LARINGOSCOPIA NORMAL (CLASE I) VS EDEMA GLÓTICO SEVERO EN PREECLAMPSIA</text>
  </g>

  <!-- Left Panel: Normal Glottis -->
  <g transform="translate(50, 95)">
    <rect width="535" height="545" rx="20" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <rect width="535" height="45" rx="20" fill="url(#panelGradNormal)"/>
    <text x="267" y="28" fill="#34d399" font-size="14" font-weight="900" text-anchor="middle" font-family="sans-serif">1. VÍA AÉREA NORMAL (CORMACK-LEHANE I)</text>

    <!-- Normal Anatomy Illustration -->
    <!-- Larynx circle -->
    <ellipse cx="267" cy="230" rx="160" ry="140" fill="#064e3b" opacity="0.25" stroke="#10b981" stroke-width="2"/>
    <ellipse cx="267" cy="230" rx="130" ry="115" fill="#022c22" stroke="#059669" stroke-width="2"/>

    <!-- Epiglottis -->
    <path d="M 170 145 C 220 120 314 120 364 145 C 340 170 290 175 267 175 C 244 175 194 170 170 145 Z" fill="#fda4af" stroke="#f43f5e" stroke-width="2"/>
    <text x="267" y="155" fill="#881337" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Epiglotis delgada y flexible</text>

    <!-- Vocal cords -->
    <polygon points="267,175 210,290 324,290" fill="#020617" stroke="#334155" stroke-width="2"/>
    <!-- Left cord -->
    <path d="M 267 175 L 210 290 L 225 292 L 267 182 Z" fill="url(#cordGradNormal)" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Right cord -->
    <path d="M 267 175 L 324 290 L 309 292 L 267 182 Z" fill="url(#cordGradNormal)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Arytenoids -->
    <circle cx="210" cy="295" r="16" fill="#fbcfe8" stroke="#f43f5e" stroke-width="2"/>
    <circle cx="324" cy="295" r="16" fill="#fbcfe8" stroke="#f43f5e" stroke-width="2"/>

    <!-- Open lumen indicator -->
    <line x1="235" y1="245" x2="299" y2="245" stroke="#34d399" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="267" y="240" fill="#34d399" font-size="12" font-weight="900" text-anchor="middle" font-family="sans-serif">Luz Glótica &gt; 12-14 mm</text>

    <!-- Details Box -->
    <g transform="translate(25, 400)">
      <rect width="485" height="125" rx="12" fill="#022c22" stroke="#059669" stroke-width="1.5"/>
      <text x="15" y="25" fill="#a7f3d0" font-size="12" font-weight="bold" font-family="sans-serif">✓ Cuerdas vocales verdaderas nítidas y aperladas</text>
      <text x="15" y="48" fill="#a7f3d0" font-size="12" font-weight="bold" font-family="sans-serif">✓ Luz adecuada para Tubo Endotraqueal 7.0 - 7.5 mm</text>
      <text x="15" y="71" fill="#a7f3d0" font-size="12" font-weight="bold" font-family="sans-serif">✓ Sin edema en pliegues aritenoepiglóticos</text>
      <text x="15" y="94" fill="#34d399" font-size="12" font-weight="900" font-family="sans-serif">✓ Intubación orotraqueal estándar sin resistencia</text>
    </g>
  </g>

  <!-- Right Panel: Critical Edema in Preeclampsia -->
  <g transform="translate(615, 95)">
    <rect width="535" height="545" rx="20" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <rect width="535" height="45" rx="20" fill="url(#panelGradEdema)"/>
    <text x="267" y="28" fill="#fda4af" font-size="14" font-weight="900" text-anchor="middle" font-family="sans-serif">2. EDEMA GLÓTICO SEVERO EN PREECLAMPSIA</text>

    <!-- Edematous Anatomy Illustration -->
    <ellipse cx="267" cy="230" rx="160" ry="140" fill="#881337" opacity="0.3" stroke="#f43f5e" stroke-width="2"/>
    <ellipse cx="267" cy="230" rx="130" ry="115" fill="#4c0519" stroke="#e11d48" stroke-width="2"/>

    <!-- Swollen Epiglottis -->
    <path d="M 140 140 C 200 90 334 90 394 140 C 360 190 300 195 267 195 C 234 195 174 190 140 140 Z" fill="url(#edemaMucosa)" stroke="#9f1239" stroke-width="3"/>
    <text x="267" y="150" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">Epiglotis en omega engrosada y congestiva</text>

    <!-- Hugely swollen arytenoids kissing -->
    <circle cx="235" cy="285" r="42" fill="url(#edemaMucosa)" stroke="#e11d48" stroke-width="3"/>
    <circle cx="299" cy="285" r="42" fill="url(#edemaMucosa)" stroke="#e11d48" stroke-width="3"/>
    <text x="267" y="335" fill="#fecdd3" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">"Aritenoides en Beso" (Kissing Arytenoids)</text>

    <!-- Critical Slit Lumen -->
    <ellipse cx="267" cy="240" rx="7" ry="18" fill="#020617" stroke="#fb7185" stroke-width="2"/>
    <line x1="210" y1="240" x2="255" y2="240" stroke="#f43f5e" stroke-width="2"/>
    <line x1="279" y1="240" x2="324" y2="240" stroke="#f43f5e" stroke-width="2"/>
    <text x="267" y="215" fill="#fecdd3" font-size="11" font-weight="900" text-anchor="middle" font-family="sans-serif">Luz Crítica &lt; 4 mm</text>

    <!-- Danger Details Box -->
    <g transform="translate(25, 400)">
      <rect width="485" height="125" rx="12" fill="#4c0519" stroke="#e11d48" stroke-width="1.5"/>
      <text x="15" y="25" fill="#fecdd3" font-size="12" font-weight="bold" font-family="sans-serif">⚠️ Oclusión concéntrica por hipoalbuminemia &amp; fuga capilar</text>
      <text x="15" y="48" fill="#fecdd3" font-size="12" font-weight="bold" font-family="sans-serif">⚠️ Tubos estándar 7.0-7.5 no pasan (trauma y sangrado masivo)</text>
      <text x="15" y="71" fill="#fecdd3" font-size="12" font-weight="bold" font-family="sans-serif">⚠️ Selección obligada: Tubo 6.0 - 6.5 mm con guía / Bougie</text>
      <text x="15" y="94" fill="#fb7185" font-size="12" font-weight="900" font-family="sans-serif">⚠️ 1ª Elección: Videolaringoscopio con pala angulada + Kit FONA</text>
    </g>
  </g>
</svg>