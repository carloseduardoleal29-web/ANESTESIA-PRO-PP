<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="vortexBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#041527"/>
      <stop offset="60%" stop-color="#020b14"/>
      <stop offset="100%" stop-color="#010408"/>
    </radialGradient>
    <linearGradient id="greenZoneGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="cicoRedGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="line1Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="line2Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="line3Grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#vortexBg)"/>

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
  </g>

  <!-- Header Banner -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="70" y="73" fill="#38bdf8" font-size="22" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1">EL ENFOQUE VORTEX • MANEJO DE LA VÍA AÉREA DIFÍCIL</text>
  <text x="70" y="91" fill="#94a3b8" font-size="12" font-weight="700" font-family="system-ui, sans-serif">DR. NICHOLAS CHRIMES (BJA / DAS / ANZCA / WFSA) • AYUDA COGNITIVA VISUAL DE CRISIS</text>
  <rect x="980" y="47" width="155" height="34" rx="17" fill="#059669" stroke="#34d399" stroke-width="1.2"/>
  <text x="1057" y="69" fill="#ecfdf5" font-size="12" font-weight="900" font-family="monospace" text-anchor="middle">ZONA VERDE SpO2</text>

  <!-- Left: The Vortex Visual Funnel Diagram -->
  <g transform="translate(100, 140)">
    <!-- Outer Green Zone Ring -->
    <ellipse cx="260" cy="80" rx="240" ry="60" fill="none" stroke="url(#greenZoneGrad)" stroke-width="12" opacity="0.9"/>
    <ellipse cx="260" cy="80" rx="240" ry="60" fill="#059669" opacity="0.08"/>
    <text x="260" y="45" fill="#34d399" font-size="15" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle" letter-spacing="1">🟢 ZONA VERDE: OXIGENACIÓN ALVEOLAR CONFIRMADA</text>

    <!-- Ring 1: Face Mask (Mascarilla Facial) -->
    <ellipse cx="260" cy="180" rx="190" ry="48" fill="none" stroke="url(#line1Grad)" stroke-width="8"/>
    <text x="260" y="160" fill="#7dd3fc" font-size="13" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">LÍNEA 1: MASCARILLA FACIAL (FMV)</text>

    <!-- Ring 2: Supraglottic Airway (DSG) -->
    <ellipse cx="260" cy="280" rx="140" ry="36" fill="none" stroke="url(#line2Grad)" stroke-width="8"/>
    <text x="260" y="265" fill="#a5b4fc" font-size="13" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">LÍNEA 2: DISPOSITIVO SUPRAGLÓTICO (DSG)</text>

    <!-- Ring 3: Endotracheal Tube (TET) -->
    <ellipse cx="260" cy="380" rx="90" ry="24" fill="none" stroke="url(#line3Grad)" stroke-width="7"/>
    <text x="260" y="370" fill="#fde047" font-size="12" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">LÍNEA 3: TUBO ENDOTRAQUEAL (TET)</text>

    <!-- The CICO Vortex Core (Neck Rescue / eFONA) -->
    <ellipse cx="260" cy="480" rx="55" ry="18" fill="url(#cicoRedGrad)" stroke="#f87171" stroke-width="3"/>
    <text x="260" y="485" fill="#ffffff" font-size="12" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">🚨 CICO</text>
    <text x="260" y="525" fill="#f87171" font-size="13" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">RESCATE DE CUELLO (eFONA)</text>
    <text x="260" y="542" fill="#fca5a5" font-size="11" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">Cricotiroidotomía Escalpelo-Bougie-Tubo</text>

    <!-- Funnel connecting walls -->
    <line x1="20" y1="80" x2="205" y2="480" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
    <line x1="500" y1="80" x2="315" y2="480" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
  </g>

  <!-- Right: The 5 Optimization Categories & Rules -->
  <g transform="translate(660, 140)">
    <!-- Rules Box -->
    <rect x="0" y="0" width="480" height="110" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="32" fill="#38bdf8" font-size="15" font-weight="900" font-family="system-ui, sans-serif">REGLA FUNDAMENTAL DE MEJOR ESFUERZO:</text>
    <text x="25" y="56" fill="#f1f5f9" font-size="12" font-weight="600" font-family="system-ui, sans-serif">• Máximo 3 intentos por cada línea de vida no quirúrgica.</text>
    <text x="25" y="76" fill="#f1f5f9" font-size="12" font-weight="600" font-family="system-ui, sans-serif">• Cada nuevo intento EXIGE cambiar al menos 1 de las 5 optimizaciones.</text>
    <text x="25" y="96" fill="#34d399" font-size="12" font-weight="800" font-family="system-ui, sans-serif">✓ Si retorna oxigenación alveolar en cualquier punto: VUELVE A ZONA VERDE.</text>

    <!-- 5 Optimization Pillars -->
    <rect x="0" y="130" width="480" height="420" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="162" fill="#fbbf24" font-size="15" font-weight="900" font-family="system-ui, sans-serif">LAS 5 CATEGORÍAS DE OPTIMIZACIÓN VORTEX:</text>

    <!-- Item 1 -->
    <rect x="20" y="180" width="440" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="45" cy="210" r="14" fill="#0284c7"/>
    <text x="45" y="215" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">1</text>
    <text x="70" y="202" fill="#38bdf8" font-size="13" font-weight="800">TAMAÑO &amp; TIPO DE DISPOSITIVO</text>
    <text x="70" y="222" fill="#94a3b8" font-size="11">Cambiar número de pala/máscara, videolaringoscopio hipercurvo vs Macintosh.</text>

    <!-- Item 2 -->
    <rect x="20" y="250" width="440" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="45" cy="280" r="14" fill="#0284c7"/>
    <text x="45" y="285" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">2</text>
    <text x="70" y="272" fill="#38bdf8" font-size="13" font-weight="800">POSICIÓN DE CABEZA &amp; CUELLO</text>
    <text x="70" y="292" fill="#94a3b8" font-size="11">Posición de olfateo (sniffing), rampa en obesos mórbidos, elevación occipital.</text>

    <!-- Item 3 -->
    <rect x="20" y="320" width="440" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="45" cy="350" r="14" fill="#0284c7"/>
    <text x="45" y="355" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">3</text>
    <text x="70" y="342" fill="#38bdf8" font-size="13" font-weight="800">MANIPULACIÓN LARÍNGEA EXTERNA</text>
    <text x="70" y="362" fill="#94a3b8" font-size="11">Maniobra BURP (Backward-Upward-Rightward Pressure) y subluxación mandibular.</text>

    <!-- Item 4 -->
    <rect x="20" y="390" width="440" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="45" cy="420" r="14" fill="#0284c7"/>
    <text x="45" y="425" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">4</text>
    <text x="70" y="412" fill="#38bdf8" font-size="13" font-weight="800">DESOBSTRUCCIÓN &amp; ASPIRACIÓN</text>
    <text x="70" y="432" fill="#94a3b8" font-size="11">Aspirador rígido Yankauer, técnica SALAD en vómito masivo, cánula orofaríngea Guedel.</text>

    <!-- Item 5 -->
    <rect x="20" y="460" width="440" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <circle cx="45" cy="490" r="14" fill="#0284c7"/>
    <text x="45" y="495" fill="#fff" font-size="12" font-weight="900" text-anchor="middle">5</text>
    <text x="70" y="482" fill="#38bdf8" font-size="13" font-weight="800">ADYUVANTES &amp; RELAJACIÓN NEUROMUSCULAR</text>
    <text x="70" y="502" fill="#94a3b8" font-size="11">Bougie Frova/Eschmann, fiador maleable, dosis plena de bloqueo (Rocuronio 1.2 mg/kg).</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="720" width="1120" height="50" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="600" y="752" fill="#64748b" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">ANESTESIAPRO • ATLAS ILUSTRADO DE MANEJO DE CRISIS • DR. CARLOS LEAL</text>
</svg>
