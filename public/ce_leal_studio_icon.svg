<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="iconBgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0f2b4c" />
      <stop offset="55%" stop-color="#0a1d35" />
      <stop offset="100%" stop-color="#040b17" />
    </radialGradient>
    <linearGradient id="iconChromeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="25%" stop-color="#bae6fd" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="iconArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <filter id="iconDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect width="320" height="320" rx="64" fill="url(#iconBgGrad)" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.5" />
  
  <!-- Ambient Glow Behind Emblem -->
  <ellipse cx="160" cy="155" rx="100" ry="70" fill="#0284c7" opacity="0.3" filter="url(#iconGlow)" />

  <!-- 3D METALLIC EMBLEM: CE + ASCENDING ARROW -->
  <g transform="translate(160, 150) scale(0.95)" filter="url(#iconDropShadow)" text-anchor="middle">
    <!-- Back Glow Contour -->
    <g opacity="0.35" filter="url(#iconGlow)">
      <path d="M -20 -70 C -75 -70 -120 -25 -120 20 C -120 65 -75 110 -20 110 C 15 110 40 95 55 75 L 25 55 C 15 70 -3 82 -20 82 C -55 82 -88 52 -88 20 C -88 -12 -55 -42 -20 -42 C 0 -42 20 -30 32 -15 L 62 -35 C 40 -58 12 -70 -20 -70 Z" fill="#38bdf8" />
      <path d="M -5 -65 L 85 -65 L 85 -37 L 25 -37 L 25 -10 L 75 -10 L 75 18 L 25 18 L 25 78 L 90 78 L 90 106 L -5 106 Z" fill="#0284c7" />
    </g>

    <!-- Main Solid 3D Base: Letter E -->
    <path d="M 0 -62 L 95 -62 L 95 -34 L 32 -34 L 32 -6 L 82 -6 L 82 20 L 32 20 L 32 78 L 98 78 L 98 106 L 0 106 Z" 
          fill="url(#iconChromeCyan)" 
          stroke="#0369a1" 
          stroke-width="3" 
          stroke-linejoin="round" />

    <!-- Top Highlight Line on E -->
    <path d="M 2 -60 L 93 -60 L 93 -36 L 34 -36 L 34 -4 L 80 -4 L 80 18 L 34 18 L 34 80 L 96 80 L 96 104 L 2 104 Z" 
          fill="none" 
          stroke="#e0f2fe" 
          stroke-width="1.5" 
          opacity="0.75" />

    <!-- Main Solid 3D Base: Letter C -->
    <path d="M -15 -68 C -70 -68 -118 -25 -118 20 C -118 65 -70 108 -15 108 C 22 108 55 88 68 62 L 40 44 C 28 62 8 78 -15 78 C -52 78 -86 48 -86 20 C -86 -8 -52 -38 -15 -38 C 5 -38 25 -25 38 -10 L 68 -28 C 50 -52 18 -68 -15 -68 Z" 
          fill="url(#iconChromeCyan)" 
          stroke="#bae6fd" 
          stroke-width="3.5" 
          stroke-linejoin="round" />

    <!-- Inner Metallic Sheen Arc on C -->
    <path d="M -15 -62 C -65 -62 -110 -20 -110 20 C -110 60 -65 100 -15 100 C 18 100 48 82 60 58" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2" 
          opacity="0.85" />

    <!-- Dynamic Ascending Swoosh & Arrowhead -->
    <path d="M -45 52 C -20 62 10 50 35 15 C 55 -15 80 -45 110 -68" 
          fill="none" 
          stroke="url(#iconArrowGrad)" 
          stroke-width="12" 
          stroke-linecap="round" />

    <path d="M -42 52 C -18 61 10 50 35 15 C 55 -15 80 -45 106 -66" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linecap="round" 
          opacity="0.95" />

    <polygon points="112,-88 126,-50 92,-64" 
             fill="url(#iconArrowGrad)" 
             stroke="#ffffff" 
             stroke-width="2.5" 
             stroke-linejoin="round" />
  </g>
</svg>
