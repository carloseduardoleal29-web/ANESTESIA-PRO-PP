<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a" />
      <stop offset="50%" stopColor="#0369a1" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="50%" stopColor="#fbbf24" />
      <stop offset="100%" stopColor="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo circular con borde premium -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#cyanGrad)" stroke-width="4" opacity="0.6" />

  <!-- Escudo Central -->
  <path d="M 256 64 C 360 64, 416 96, 416 192 C 416 336, 320 416, 256 448 C 192 416, 96 336, 96 192 C 96 96, 152 64, 256 64 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="8" 
        filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))" />

  <!-- Cruz Médica Suave de Fondo -->
  <path d="M 232 140 H 280 V 360 H 232 Z M 160 210 H 352 V 258 H 160 Z" 
        fill="#0284c7" 
        opacity="0.25" />

  <!-- Onda de Electrocardiograma (ECG) Dinámica -->
  <path d="M 120 250 L 190 250 L 205 200 L 220 310 L 245 150 L 265 330 L 285 230 L 305 270 L 320 250 L 392 250" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)" />

  <!-- Símbolo del Estetoscopio &amp; Anestesiología -->
  <!-- Tubo del Estetoscopio rodeando el centro -->
  <path d="M 180 160 C 180 120, 220 100, 256 100 C 292 100, 332 120, 332 160 L 332 200 C 332 270, 280 320, 256 340 C 232 320, 180 270, 180 200 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        stroke-dasharray="12 4"
        opacity="0.8" />

  <!-- Diafragma del estetoscopio -->
  <circle cx="256" cy="350" r="22" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="5" />
  <circle cx="256" cy="350" r="10" fill="#38bdf8" />

  <!-- Jeringa de Anestesia / Aguja Espinal Estilizada -->
  <g transform="translate(256, 175) rotate(-35) translate(-256, -175)">
    <!-- Cuerpo jeringa -->
    <rect x="246" y="110" width="20" height="70" rx="3" fill="#ffffff" opacity="0.9" stroke="#0284c7" stroke-width="3" />
    <!-- Líquido anestésico -->
    <rect x="248" y="130" width="16" height="48" fill="#38bdf8" />
    <!-- Émbolo -->
    <rect x="252" y="75" width="8" height="35" fill="#e2e8f0" stroke="#0284c7" stroke-width="2" />
    <rect x="242" y="72" width="28" height="6" rx="2" fill="#0284c7" />
    <!-- Aguja -->
    <line x1="256" y1="180" x2="256" y2="215" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
    <!-- Gota anestésica -->
    <circle cx="256" cy="223" r="3.5" fill="#38bdf8" />
  </g>

  <!-- Tipografía Oficial AnestesiaPro -->
  <text x="256" y="415" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#ffffff">
    ANESTESIA<tspan fill="#38bdf8">PRO</tspan>
  </text>
  
  <text x="256" y="435" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="14" 
        font-weight="700" 
        letter-spacing="1" 
        text-anchor="middle" 
        fill="#fbbf24">
    DR. CARLOS LEAL
  </text>

  <!-- Estrellas de Calidad Médica -->
  <circle cx="210" cy="85" r="4" fill="#fbbf24" />
  <circle cx="256" cy="76" r="6" fill="#fbbf24" />
  <circle cx="302" cy="85" r="4" fill="#fbbf24" />
</svg>
