<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="orexinBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#042017"/>
      <stop offset="60%" stop-color="#02100b"/>
      <stop offset="100%" stop-color="#010805"/>
    </radialGradient>
    <linearGradient id="wakeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="sleepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#orexinBg)"/>

  <!-- Header Banner -->
  <rect x="40" y="30" width="1120" height="70" rx="16" fill="#062d22" stroke="#10b981" stroke-width="1.5"/>
  <text x="70" y="73" fill="#34d399" font-size="22" font-weight="900" font-family="system-ui, sans-serif" letter-spacing="1">EL INTERRUPTOR NEUROQUÍMICO DEL DESPERTAR • OREXINA (HIPOCRETINA)</text>
  <text x="70" y="91" fill="#a7f3d0" font-size="12" font-weight="700" font-family="system-ui, sans-serif">NATURE NEUROSCIENCE / PNAS / BJA / ASA • ACTUALIZACIÓN EN NEUROANESTESIA Y EMERGENCIA ACTIVA</text>
  <rect x="990" y="47" width="145" height="34" rx="17" fill="#047857" stroke="#34d399" stroke-width="1.2"/>
  <text x="1062" y="69" fill="#ecfdf5" font-size="12" font-weight="900" font-family="monospace" text-anchor="middle">OX2R AGONISTAS</text>

  <!-- Left: Lateral Hypothalamus Circuit Diagram -->
  <g transform="translate(60, 130)">
    <rect x="0" y="0" width="520" height="560" rx="16" fill="#0a382c" stroke="#059669" stroke-width="1.5"/>
    <text x="30" y="40" fill="#6ee7b7" font-size="17" font-weight="900" font-family="system-ui, sans-serif">CIRCUITO HIPOTALÁMICO DEL DESPERTAR</text>

    <!-- Center node: Hipotálamo Lateral -->
    <circle cx="260" cy="240" r="65" fill="#047857" stroke="#34d399" stroke-width="3"/>
    <text x="260" y="235" fill="#ffffff" font-size="14" font-weight="900" text-anchor="middle">HIPOTÁLAMO</text>
    <text x="260" y="253" fill="#a7f3d0" font-size="13" font-weight="900" text-anchor="middle">LATERAL</text>
    <text x="260" y="270" fill="#6ee7b7" font-size="10" font-weight="bold" text-anchor="middle">(~70,000 Neuronas)</text>

    <!-- Target 1: Tálamo -->
    <rect x="190" y="70" width="140" height="50" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="260" y="95" fill="#38bdf8" font-size="12" font-weight="900" text-anchor="middle">TÁLAMO</text>
    <text x="260" y="110" fill="#94a3b8" font-size="9" text-anchor="middle">Sincronización EEG</text>
    <line x1="260" y1="175" x2="260" y2="120" stroke="#34d399" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Target 2: Locus Coeruleus -->
    <rect x="360" y="215" width="135" height="50" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="427" y="240" fill="#fbbf24" font-size="11" font-weight="900" text-anchor="middle">LOCUS COERULEUS</text>
    <text x="427" y="255" fill="#94a3b8" font-size="9" text-anchor="middle">Noradrenalina (NA)</text>
    <line x1="325" y1="240" x2="360" y2="240" stroke="#34d399" stroke-width="3"/>

    <!-- Target 3: Prosencéfalo Basal -->
    <rect x="25" y="215" width="135" height="50" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="2"/>
    <text x="92" y="240" fill="#c084fc" font-size="11" font-weight="900" text-anchor="middle">PROSENCÉFALO</text>
    <text x="92" y="255" fill="#94a3b8" font-size="9" text-anchor="middle">Acetilcolina (ACh)</text>
    <line x1="195" y1="240" x2="160" y2="240" stroke="#34d399" stroke-width="3"/>

    <!-- Target 4: Córtex Prefrontal -->
    <rect x="190" y="360" width="140" height="50" rx="10" fill="#0f172a" stroke="#f472b6" stroke-width="2"/>
    <text x="260" y="385" fill="#f472b6" font-size="11" font-weight="900" text-anchor="middle">CÓRTEX PREFRONTAL</text>
    <text x="260" y="400" fill="#94a3b8" font-size="9" text-anchor="middle">Conciencia &amp; Vigilia</text>
    <line x1="260" y1="305" x2="260" y2="360" stroke="#34d399" stroke-width="3"/>

    <!-- Summary Box -->
    <rect x="25" y="440" width="470" height="95" rx="10" fill="#042017" stroke="#10b981" stroke-width="1"/>
    <text x="45" y="465" fill="#34d399" font-size="12" font-weight="900">EFECTO DE LA ANESTESIA GENERAL (PROPOFOL / SEVOFLURANO):</text>
    <text x="45" y="488" fill="#e2e8f0" font-size="11">• Potenciación GABA-A hiperpolariza e inhibe las neuronas de orexina.</text>
    <text x="45" y="508" fill="#e2e8f0" font-size="11">• Conlleva apagado del circuito talamocortical y patrón de supresión de salvas.</text>
    <text x="45" y="526" fill="#fbbf24" font-size="11" font-weight="bold">✓ Danavorexton (TAK-925) revierte este bloqueo en &lt; 3 minutos.</text>
  </g>

  <!-- Right: Farmacología Comparada: OX2R Agonistas vs DORA Antagonistas -->
  <g transform="translate(610, 130)">
    <!-- Card 1: Emergencia Activa -->
    <rect x="0" y="0" width="530" height="265" rx="16" fill="#0a382c" stroke="#10b981" stroke-width="1.5"/>
    <text x="30" y="40" fill="#34d399" font-size="16" font-weight="900" font-family="system-ui, sans-serif">⚡ EMERGENCIA ACTIVA: AGONISTAS OX2R</text>
    <text x="30" y="65" fill="#a7f3d0" font-size="12" font-weight="700">MOLÉCULA LÍDER: DANAVOREXTON (TAK-925) / OREXINA-A</text>

    <rect x="25" y="85" width="480" height="155" rx="12" fill="#042017" stroke="#059669" stroke-width="1"/>
    <text x="45" y="115" fill="#ecfdf5" font-size="12" font-weight="600">• Mecanismo: Activación directa de receptores OX2R acoplados a proteína Gq.</text>
    <text x="45" y="140" fill="#ecfdf5" font-size="12" font-weight="600">• Efecto EEG: Transición inmediata de ondas Delta/Burst a ritmo Beta de vigilia.</text>
    <text x="45" y="165" fill="#ecfdf5" font-size="12" font-weight="600">• Respuesta Ventilatoria: Estimulación de quimiorreceptores; previene hipoventilación.</text>
    <text x="45" y="190" fill="#34d399" font-size="12" font-weight="900">• Perla Clínica: Despierta al paciente aún bajo concentraciones plenas de anestésico.</text>
    <text x="45" y="215" fill="#fde047" font-size="12" font-weight="bold">✓ Mantiene analgesia sin revertir el efecto antinociceptivo opioide.</text>

    <!-- Card 2: DORA Antagonistas -->
    <rect x="0" y="295" width="530" height="265" rx="16" fill="#1e1b24" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="30" y="335" fill="#f43f5e" font-size="16" font-weight="900" font-family="system-ui, sans-serif">🛑 ANTAGONISTAS DORA (DUAL OREXIN RECEPTOR ANTAGONISTS)</text>
    <text x="30" y="360" fill="#fda4af" font-size="12" font-weight="700">FÁRMACOS: SUVOREXANT / LEMBOREXANT / DARIDOREXANT</text>

    <rect x="25" y="380" width="480" height="155" rx="12" fill="#18131d" stroke="#e11d48" stroke-width="1"/>
    <text x="45" y="410" fill="#ffe4e6" font-size="12" font-weight="600">• Indicación en Clínica: Tratamiento del insomnio crónico.</text>
    <text x="45" y="435" fill="#ffe4e6" font-size="12" font-weight="600">• Impacto Anestésico: Retrasa significativamente el despertar postoperatorio.</text>
    <text x="45" y="460" fill="#ffe4e6" font-size="12" font-weight="600">• Interacción Farmacológica: Potencia el efecto hipnótico de GABA-mimeticos.</text>
    <text x="45" y="485" fill="#f87171" font-size="12" font-weight="900">• Precaución Quirúrgica: Suspender noche previa a cirugías ambulatorias.</text>
    <text x="45" y="510" fill="#fb7185" font-size="12" font-weight="bold">⚠️ Su uso aumenta el riesgo de sedación residual y depresión respiratoria en URPA.</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="720" width="1120" height="50" rx="12" fill="#042017" stroke="#059669" stroke-width="1"/>
  <text x="600" y="752" fill="#6ee7b7" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="middle">ANESTESIAPRO • ATLAS NEUROANESTESIOLÓGICO • DR. CARLOS LEAL</text>
</svg>
