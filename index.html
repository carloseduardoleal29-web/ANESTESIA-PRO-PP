    <script>
      // Filter benign Vite websocket disconnection logs in AI Studio preview environment
      (function() {
        const origErr = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect to websocket') || args[0].includes('vite-plugin-pwa:dev-ready'))) {
            return;
          }
          origErr.apply(console, args);
        };
      })();
    </script>

    <!-- Auto-Framing & Mobile Viewport Engine: Guarantees 100% pixel-perfect framing without requiring desktop-mode toggle -->
    <script>
      (function() {
        function autoFrameDevice() {
          var viewportMeta = document.querySelector('meta[name="viewport"]');
          var targetConfig = 'width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no, interactive-widget=resizes-content';
          if (viewportMeta && viewportMeta.getAttribute('content') !== targetConfig) {
            viewportMeta.setAttribute('content', targetConfig);
          }
          if (document.documentElement) {
            document.documentElement.style.overflowX = 'hidden';
            document.documentElement.style.width = '100%';
            document.documentElement.style.maxWidth = '100%';
          }
          if (document.body) {
            document.body.style.overflowX = 'hidden';
            document.body.style.width = '100%';
            document.body.style.maxWidth = '100%';
          }
        }
        autoFrameDevice();
        window.addEventListener('resize', autoFrameDevice, { passive: true });
        window.addEventListener('orientationchange', function() {
          setTimeout(function() {
            autoFrameDevice();
            window.scrollTo(0, 0);
          }, 150);
        }, { passive: true });
        document.addEventListener('DOMContentLoaded', autoFrameDevice);
      })();
    </script>
